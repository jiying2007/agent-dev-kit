[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dev-kit"
version = "5.2.0"
description = "Platform-neutral agent asset compiler, distributor, and evaluator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0"]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "skills", "asset-compiler", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
quality = [
  "ruff==0.16.7",
  "pip-audit==2.10.1",
  "mypy==2.3.1",
  "types-jsonschema==4.26.0.20260518",
  "types-PyYAML==6.0.12.20260906",
]

[project.urls]
Repository = "https://github.com/jiying2007/agent-dev-kit"
Issues = "https://github.com/jiying2007/agent-dev-kit/issues"

[project.scripts]
adk = "agent_dev_kit.cli:main"
adk-phase-context = "agent_dev_kit.phase_context:main"
adk-skill-relationships = "agent_dev_kit.skill_relationships:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_dev_kit.schema_resources" = ["*.json"]
