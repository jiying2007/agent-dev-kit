[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dev-kit"
version = "3.1.0-rc.3"
description = "Platform-neutral agent asset compiler, distributor, and evaluator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0"]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "skills", "asset-compiler", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
quality = ["ruff==0.15.21", "pip-audit==2.10.1"]

[project.urls]
Repository = "https://github.com/jiying2007/agent-dev-kit"
Issues = "https://github.com/jiying2007/agent-dev-kit/issues"

[project.scripts]
adk = "agent_dev_kit.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
