[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dev-kit"
version = "3.0.0"
description = "Platform-neutral agent asset compiler, distributor, and evaluator"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["PyYAML>=5.3,<7"]
license = {file = "LICENSE"}
keywords = ["agents", "skills", "asset-compiler", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/jiying2007/agent-dev-kit"
Issues = "https://github.com/jiying2007/agent-dev-kit/issues"

[project.scripts]
adk = "agent_dev_kit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
