name: cli-support-convergence-once

on:
  push:
    branches:
      - codex/cli-support-convergence

permissions:
  contents: write

concurrency:
  group: cli-support-convergence-once
  cancel-in-progress: false

jobs:
  converge:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/cli-support-convergence
          fetch-depth: 1
          persist-credentials: true

      - name: Install bounded migration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          python -m pip install '.[quality]'

      - name: Prove CLI support import boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          refs = set()
          for root_name in ('src', 'tests', 'scripts'):
              root = Path(root_name)
              if not root.exists():
                  continue
              for path in root.rglob('*.py'):
                  if 'cli_support' in path.read_text(encoding='utf-8'):
                      refs.add(path.as_posix())
          expected = {'src/agent_dev_kit/cli.py'}
          if refs != expected:
              raise SystemExit(f'unexpected cli_support Python references: {sorted(refs)}')
          PY

      - name: Move CLI runtime substrate into owned bounded context
        run: |
          set -euo pipefail
          mv src/agent_dev_kit/cli_support.py src/agent_dev_kit/cli_runtime.py
          python - <<'PY'
          import json
          from pathlib import Path

          owner = Path('src/agent_dev_kit/cli.py')
          text = owner.read_text(encoding='utf-8')
          assert 'from .cli_support import (' in text
          owner.write_text(text.replace('from .cli_support import (', 'from .cli_runtime import ('), encoding='utf-8')

          runtime = Path('src/agent_dev_kit/cli_runtime.py')
          text = runtime.read_text(encoding='utf-8')
          old_doc = '"""Shared support primitives for the public ADK CLI entrypoint."""'
          assert text.startswith(old_doc)
          text = text.replace(old_doc, '"""CLI runtime substrate: environment, compatibility bridge, and stable output I/O."""', 1)
          runtime.write_text(text, encoding='utf-8')

          policy_path = Path('manifests/module_size_budget.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          architecture = policy['architecture_policy']
          retired = 'src/agent_dev_kit/cli_support.py'
          current = architecture['transitional_support_modules']
          assert retired in current, current
          architecture['transitional_support_modules'] = [item for item in current if item != retired]
          assert architecture.get('transitional_support_max_count') == 3, architecture
          architecture['transitional_support_max_count'] = 2
          policy_path.write_text(json.dumps(policy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify CLI runtime ownership and prepare clean candidate
        run: |
          set -euo pipefail
          TARGETS=(src/agent_dev_kit/cli.py src/agent_dev_kit/cli_runtime.py)
          ! test -e src/agent_dev_kit/cli_support.py
          test -f src/agent_dev_kit/cli_runtime.py
          ! rg -n 'cli_support' src tests scripts manifests/module_size_budget.json || {
            echo '[FAIL] retired cli_support reference remains' >&2
            exit 1
          }
          ruff check "${TARGETS[@]}" --select I --fix
          python -m compileall -q "${TARGETS[@]}"
          ruff check "${TARGETS[@]}" --select E4,E7,E9,F,B,SIM,I
          bash tests/test_module_size_budget.sh

          PYTHONPATH=src python - <<'PY'
          from agent_dev_kit import cli
          from agent_dev_kit import cli_runtime

          names = (
              'DEFAULT_TASKS', 'LEGACY_COMMANDS', 'ROOT', '_help', '_json', '_manifest',
              '_run_legacy', '_write_json', '_write_text',
          )
          for name in names:
              if getattr(cli, name) is not getattr(cli_runtime, name):
                  raise SystemExit(f'CLI re-export identity changed: {name}')
          print('[PASS] CLI runtime re-export identities preserved')
          PY

          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              manifests/module_size_budget.json|src/agent_dev_kit/cli.py|src/agent_dev_kit/cli_support.py|src/agent_dev_kit/cli_runtime.py) ;;
              *)
                echo "[FAIL] CLI convergence escaped bounded scope: $path" >&2
                exit 1
                ;;
            esac
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests/module_size_budget.json src/agent_dev_kit/cli.py src/agent_dev_kit/cli_support.py src/agent_dev_kit/cli_runtime.py
          git commit -m 'refactor(cli): retire transitional support module'
          test -z "$(git status --porcelain)"

      - name: Verify clean candidate behavior
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          bash tests/run_all.sh --quick --timing-json /tmp/cli-support-tests.json
          test -z "$(git status --porcelain)"

      - name: Publish verified candidate
        run: git push origin HEAD:codex/cli-support-convergence
