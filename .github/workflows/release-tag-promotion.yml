name: release-tag-promotion

on:
  workflow_run:
    workflows:
      - agent-dev-kit-ci
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-tag-promotion-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  promote-tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.promote.outputs.release_tag }}
      release_commit: ${{ steps.promote.outputs.release_commit }}
      release_needed: ${{ steps.promote.outputs.release_needed }}
    steps:
      - name: Checkout exact successful main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact main and synchronized version identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::workflow_run head SHA is not exact"
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "::error::checked out source does not match successful main workflow_run"
            exit 1
          fi
          REMOTE_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$REMOTE_MAIN_SHA" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "::error::successful workflow_run source is no longer current main; refusing tag promotion"
            exit 1
          fi
          bash scripts/version-manager.sh verify

      - name: Promote immutable version tag
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVIDENCE_PATH: ${{ runner.temp }}/release-tag-promotion.json
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          api_root = os.environ["GITHUB_API_URL"].rstrip("/") + f"/repos/{repository}"
          token = os.environ["GH_TOKEN"]
          head_sha = os.environ["HEAD_SHA"]
          evidence_path = Path(os.environ["EVIDENCE_PATH"])
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          version = manifest.get("version")
          if not isinstance(version, str) or not version:
              raise SystemExit("manifest version is missing")
          tag = f"v{version}"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "agent-dev-kit-release-tag-promotion",
          }

          def request(path: str, *, method: str = "GET", payload: dict[str, object] | None = None):
              data = None
              if payload is not None:
                  data = json.dumps(payload, separators=(",", ":")).encode("utf-8")
              req = urllib.request.Request(api_root + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  if exc.code == 404:
                      return 404, None
                  raise RuntimeError(f"GitHub API {method} {path} failed: HTTP {exc.code}: {body[:500]}") from exc

          def peel(obj: dict[str, str]) -> str:
              current = obj
              for _ in range(4):
                  kind = current.get("type")
                  sha = current.get("sha")
                  if not isinstance(sha, str):
                      raise RuntimeError("tag object is missing SHA")
                  if kind == "commit":
                      return sha
                  if kind != "tag":
                      raise RuntimeError(f"unsupported tag target type: {kind}")
                  status, tag_object = request(f"/git/tags/{sha}")
                  if status != 200 or not isinstance(tag_object, dict) or not isinstance(tag_object.get("object"), dict):
                      raise RuntimeError("unable to peel annotated tag")
                  current = tag_object["object"]
              raise RuntimeError("tag peel depth exceeded")

          conflict = False
          status, existing = request(f"/git/ref/tags/{tag}")
          if status == 404:
              status, tag_object = request(
                  "/git/tags",
                  method="POST",
                  payload={
                      "tag": tag,
                      "message": f"release: {tag}",
                      "object": head_sha,
                      "type": "commit",
                  },
              )
              if status != 201 or not isinstance(tag_object, dict) or not isinstance(tag_object.get("sha"), str):
                  raise RuntimeError("annotated tag object creation did not return HTTP 201")
              status, created = request(
                  "/git/refs",
                  method="POST",
                  payload={"ref": f"refs/tags/{tag}", "sha": tag_object["sha"]},
              )
              if status != 201 or not isinstance(created, dict) or not isinstance(created.get("object"), dict):
                  raise RuntimeError("annotated tag ref creation did not return HTTP 201")
              if created["object"].get("type") != "tag":
                  raise RuntimeError("created release ref is not an annotated tag")
              target_sha = peel(created["object"])
              if target_sha != head_sha:
                  raise RuntimeError("created release tag does not resolve to exact main SHA")
              promotion_status = "created-annotated"
              release_needed = True
          else:
              if not isinstance(existing, dict) or not isinstance(existing.get("object"), dict):
                  raise RuntimeError("existing tag response is malformed")
              target_sha = peel(existing["object"])
              if target_sha == head_sha:
                  promotion_status = "existing-exact"
                  release_needed = True
              else:
                  promotion_status = "source-version-tag-conflict"
                  release_needed = False
                  conflict = True

          evidence = {
              "schema": "adk-release-tag-promotion/v1",
              "repository": repository,
              "version": version,
              "tag": tag,
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "successful_main_sha": head_sha,
              "tag_target_sha": target_sha,
              "status": promotion_status,
              "release_needed": release_needed,
              "rules": {
                  "successful_main_ci_required": True,
                  "current_main_identity_required": True,
                  "version_identity_must_verify": True,
                  "existing_version_tag_must_not_move": True,
                  "existing_version_tag_must_match_current_main": True,
                  "new_version_tags_must_be_annotated": True,
              },
          }
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"release_tag={tag}\n")
              handle.write(f"release_commit={head_sha}\n")
              handle.write(f"release_needed={'true' if release_needed else 'false'}\n")
          print(json.dumps(evidence, ensure_ascii=False, separators=(",", ":")))
          if conflict:
              raise RuntimeError(
                  f"source version {version} already has immutable tag {tag} at {target_sha}; "
                  f"current main is {head_sha}; bump SemVer instead of reusing the version"
              )
          PY

      - name: Upload tag promotion evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adk-release-tag-promotion-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/release-tag-promotion.json
          if-no-files-found: error
          retention-days: 90

  release:
    needs: promote-tag
    if: ${{ needs.promote-tag.outputs.release_needed == 'true' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.promote-tag.outputs.release_tag }}
      release_commit: ${{ needs.promote-tag.outputs.release_commit }}
