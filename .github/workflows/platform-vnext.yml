name: platform-vnext

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-vnext-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform-vnext:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check .
      - name: Compile vNext modules
        run: python -m py_compile src/agent_dev_kit/platform_vnext.py src/agent_dev_kit/platform_vnext_cli.py tools/control_plane/mcp_freshness_ssot.py
      - name: Validate Agent Platform vNext primitives
        run: bash tests/test_platform_vnext.sh
      - name: Inspect MCP freshness authority
        run: python tools/control_plane/mcp_freshness_ssot.py --as-of 2026-09-12 --summary-json
      - name: Validate MCP freshness single source of truth
        run: bash tests/test_mcp_freshness_ssot.sh
