name: Prepare tested effect trials
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: read
jobs:
  prepare:
    if: >-
      github.actor == 'jiying2007' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/effect-trials-7.1.0' &&
      github.event.pull_request.base.sha == '399ca5ae89a7afb6a04efe0c53ee2c2f2890ce34'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Validate isolated preparation and exact tested patch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          helpers = {'.github/workflows/prepare-effect-trials.yml'} | {f'.github/effect-trials-{i}.b64' for i in range(4)}
          changed = set(subprocess.check_output(['git','diff','--name-only','399ca5ae89a7afb6a04efe0c53ee2c2f2890ce34','HEAD'],text=True).splitlines())
          assert changed == helpers, changed
          raw = b''.join(Path(f'.github/effect-trials-{i}.b64').read_bytes() for i in range(4))
          assert len(raw) == 23732
          patch = gzip.decompress(base64.b64decode(raw,validate=True))
          assert len(patch) == 81922
          assert hashlib.sha256(patch).hexdigest() == '83c4d42755390b5f82801353b0ecd17e73244eb5315e4b74d8c96638d53b1987'
          Path('/tmp/effect-trials.patch').write_bytes(patch)
          PY
          git apply --check /tmp/effect-trials.patch
          git apply --index /tmp/effect-trials.patch
      - name: Synchronize version through canonical authority and verify
        run: |
          set -euo pipefail
          python -m pip install .
          PYTHONPATH=src python -m agent_dev_kit.versioning sync-identity --root . --target 7.1.0 --actor effect-trials-implementation
          git add .version-lock CONTEXT.md README.md manifest.json manifests/software_m5_eval_contract.json pyproject.toml src/agent_dev_kit/__init__.py
          PYTHONDONTWRITEBYTECODE=1 bash tests/test_effect_trials.sh
          PYTHONDONTWRITEBYTECODE=1 bash tests/test_effect_comparator.sh
          PYTHONDONTWRITEBYTECODE=1 bash tests/test_contract_registry.sh
          PYTHONDONTWRITEBYTECODE=1 bash tests/test_schema_resource_sync.sh
          PYTHONDONTWRITEBYTECODE=1 bash tests/test_module_size_budget.sh
          git diff --cached --check
      - name: Remove all preparation inputs and push guarded feature commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git rm .github/workflows/prepare-effect-trials.yml .github/effect-trials-{0,1,2,3}.b64
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert not any(p.startswith('.github/') and not (p == '.github/workflows/prepare-effect-trials.yml' or p.startswith('.github/effect-trials-')) for p in changed)
          assert len(changed) == 29, (len(changed), sorted(changed))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(evaluation): 增加受控重复试验与任务级效果比较'
          test "$(git ls-remote origin refs/heads/feat/effect-trials-7.1.0 | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/effect-trials-7.1.0
          git diff --stat 399ca5ae89a7afb6a04efe0c53ee2c2f2890ce34 HEAD
