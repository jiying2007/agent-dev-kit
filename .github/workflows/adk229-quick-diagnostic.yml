name: ADK 229 one-shot quick evidence

on:
  push:
    branches: [feat/superagent-attention-contract-20261101]
    paths:
      - .github/workflows/adk229-quick-diagnostic.yml

permissions:
  contents: read

jobs:
  quick-source-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 53bd19aa1cd767626093aff4c952d84802da4172
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install original free regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck
          python -m pip install '.[test]'
      - name: Run actual quick suite, retain honest failure and per-test evidence
        shell: bash
        run: |
          set -uo pipefail
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "53bd19aa1cd767626093aff4c952d84802da4172"
          git hash-object tests/run_all.sh tests/test_intent_boundary_governance.sh tests/test_superagent_method_contract.py
          set +e
          bash tests/run_all.sh --quick --timing-json "$RUNNER_TEMP/adk229-quick-timing.json" > "$RUNNER_TEMP/adk229-quick.log" 2>&1
          rc=$?
          set -e
          grep -E '^\[(PASS|FAIL|SUMMARY)\]' "$RUNNER_TEMP/adk229-quick.log" || true
          python3 - "$RUNNER_TEMP/adk229-quick-timing.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          matched = [x for x in data["tests"] if x["name"] == "test_intent_boundary_governance"]
          print("QUICK_SUITE_STATUS=", data["status"])
          print("QUICK_TESTS=", data["total"], "PASSED=", data["pass"], "FAILED=", data["fail"])
          print("METHOD_CONTRACT_IN_QUICK=", matched)
          if len(matched) != 1 or matched[0]["status"] != "pass":
              raise SystemExit("method contract quick owner absent or failed")
          PY
          {
            echo "## Actual Quick source diagnostic"
            echo "- Exact tested source SHA: 53bd19aa1cd767626093aff4c952d84802da4172"
            echo "- Diagnostic workflow event SHA: $GITHUB_SHA"
            echo "- Real quick suite exit code: $rc"
            echo "- No model turn, credentials, Codex or Work executed"
            echo "- Failure is preserved; this proof does not replace required PR CI"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Retain actual per-test quick evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adk229-quick-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/adk229-quick.log
            ${{ runner.temp }}/adk229-quick-timing.json
          retention-days: 7
          if-no-files-found: warn
