name: security-dependency-review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Inspect dependency manifest changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- pyproject.toml

      - name: Install repository-owned audit toolchain
        run: python -m pip install '.[quality]'

      - name: Audit candidate dependency graph
        run: pip-audit --strict --progress-spinner off .
