name: support-debt-convergence-once

on:
  push:
    branches:
      - codex/support-debt-convergence

permissions:
  contents: write

concurrency:
  group: support-debt-convergence-once
  cancel-in-progress: false

jobs:
  converge:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/support-debt-convergence
          fetch-depth: 1
          persist-credentials: true

      - name: Install bounded migration dependencies
        run: python -m pip install '.[quality]'

      - name: Prove support import boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roots = (Path('src'), Path('tests'))
          expected = {
              'evaluation_support': {'src/agent_dev_kit/evaluation.py'},
              'readiness_support': {'src/agent_dev_kit/readiness.py'},
          }
          for token, allowed in expected.items():
              refs = {
                  path.as_posix()
                  for root in roots
                  for path in root.rglob('*.py')
                  if token in path.read_text(encoding='utf-8')
              }
              if refs != allowed:
                  raise SystemExit(f'unexpected {token} references: {sorted(refs)}')
          PY

      - name: Move behavior into named bounded contexts
        run: |
          set -euo pipefail
          mv src/agent_dev_kit/evaluation_support.py src/agent_dev_kit/evaluation_runtime.py
          mv src/agent_dev_kit/readiness_support.py src/agent_dev_kit/readiness_evidence.py
          python - <<'PY'
          import json
          from pathlib import Path

          evaluation = Path('src/agent_dev_kit/evaluation.py')
          text = evaluation.read_text(encoding='utf-8')
          assert 'from .evaluation_support import (' in text
          evaluation.write_text(text.replace('from .evaluation_support import (', 'from .evaluation_runtime import ('), encoding='utf-8')

          readiness = Path('src/agent_dev_kit/readiness.py')
          text = readiness.read_text(encoding='utf-8')
          assert 'from .readiness_support import (' in text
          readiness.write_text(text.replace('from .readiness_support import (', 'from .readiness_evidence import ('), encoding='utf-8')

          policy_path = Path('manifests/module_size_budget.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          architecture = policy['architecture_policy']
          retired = {
              'src/agent_dev_kit/evaluation_support.py',
              'src/agent_dev_kit/readiness_support.py',
          }
          current = architecture['transitional_support_modules']
          assert retired <= set(current), current
          architecture['transitional_support_modules'] = [item for item in current if item not in retired]
          architecture['transitional_support_max_count'] = 4
          policy_path.write_text(json.dumps(policy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test = Path('tests/test_module_size_budget.sh')
          text = test.read_text(encoding='utf-8')
          needle = '''    if len(allowed_support_set) != len(allowed_support):\n        failures.append("transitional_support_modules contains duplicates")\n\n    actual_support = {\n'''
          replacement = '''    if len(allowed_support_set) != len(allowed_support):\n        failures.append("transitional_support_modules contains duplicates")\n    support_max_count = architecture.get("transitional_support_max_count")\n    if not isinstance(support_max_count, int) or isinstance(support_max_count, bool) or support_max_count < 0:\n        failures.append("transitional_support_max_count must be a non-negative integer")\n    elif len(allowed_support_set) > support_max_count:\n        failures.append(\n            f"transitional support debt exceeded ratchet: count={len(allowed_support_set)} max={support_max_count}"\n        )\n\n    actual_support = {\n'''
          assert needle in text
          test.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY

      - name: Prepare clean candidate commit
        run: |
          set -euo pipefail
          TARGETS=(
            src/agent_dev_kit/evaluation.py
            src/agent_dev_kit/evaluation_runtime.py
            src/agent_dev_kit/readiness.py
            src/agent_dev_kit/readiness_evidence.py
          )
          ! test -e src/agent_dev_kit/evaluation_support.py
          ! test -e src/agent_dev_kit/readiness_support.py
          test -f src/agent_dev_kit/evaluation_runtime.py
          test -f src/agent_dev_kit/readiness_evidence.py
          python - <<'PY'
          from pathlib import Path
          for root in (Path('src'), Path('tests')):
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.py', '.sh'}:
                      text = path.read_text(encoding='utf-8')
                      if 'evaluation_support' in text or 'readiness_support' in text:
                          raise SystemExit(f'retired support reference remains: {path}')
          PY
          ruff check "${TARGETS[@]}" --select I --fix
          python -m compileall -q "${TARGETS[@]}"
          ruff check "${TARGETS[@]}" --select E4,E7,E9,F,B,SIM,I
          bash tests/test_module_size_budget.sh

          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              manifests/module_size_budget.json|tests/test_module_size_budget.sh|src/agent_dev_kit/evaluation.py|src/agent_dev_kit/evaluation_support.py|src/agent_dev_kit/evaluation_runtime.py|src/agent_dev_kit/readiness.py|src/agent_dev_kit/readiness_support.py|src/agent_dev_kit/readiness_evidence.py) ;;
              *)
                echo "[FAIL] support convergence escaped bounded scope: $path" >&2
                exit 1
                ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests/module_size_budget.json tests/test_module_size_budget.sh src/agent_dev_kit
          git commit -m 'refactor(architecture): retire evaluation and readiness support modules'
          test -z "$(git status --porcelain)"

      - name: Verify clean candidate behavior
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          bash tests/run_all.sh --quick --timing-json /tmp/support-debt-tests.json
          test -z "$(git status --porcelain)"

      - name: Publish verified candidate
        run: git push origin HEAD:codex/support-debt-convergence
