name: Canonical Change Finalize Once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.ref == 'codex/canonical-change-contract' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/canonical-change-contract
          fetch-depth: 0

      - name: Restore surgical manifest diff and retire bridge test name
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:manifest.json > manifest.json
          python - <<'PY'
          from pathlib import Path

          path = Path('manifest.json')
          text = path.read_text(encoding='utf-8')
          profile = '''    "openspec-driven": {
              "description": "Spec 驱动开发配置（需求/设计/任务链路）",
              "trigger_examples": [
                "Spec 驱动开发",
                "需求分析与设计",
                "任务拆解"
              ],
              "extends": "core"
            },
          '''
          if text.count(profile) != 1:
              raise SystemExit('[FAIL] expected exactly one openspec-driven profile block in main manifest')
          text = text.replace(profile, '', 1)
          old = '"description": "agent-dev-kit 变更工件、阶段门禁与证据索引规范"'
          new = '"description": "agent-dev-kit 原生 Canonical Change Contract、阶段门禁、证据与 provenance 规范"'
          if text.count(old) != 1:
              raise SystemExit('[FAIL] expected exactly one change-set description in main manifest')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git mv tests/test_openspec_bridge.sh tests/test_openspec_isolation.sh
          sed -i 's/test_openspec_bridge\.sh/test_openspec_isolation.sh/' tests/run_all.sh
          rm .github/workflows/canonical-change-finalize-once.yml

          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert all('openspec' not in name.lower() for name in value.get('profiles', {}))
          PY
          test ! -e scripts/openspec-bridge.sh
          test ! -e tests/test_openspec_bridge.sh
          test -e tests/test_openspec_isolation.sh
          grep -q 'test_openspec_isolation.sh' tests/run_all.sh
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore(governance): finalize canonical change cleanup'
          git push origin HEAD:codex/canonical-change-contract
