name: oneshot-release-support-quality
on:
  push:
    branches: [codex/release-support-split-20260912]
permissions:
  contents: write
jobs:
  quality:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install ruff==0.15.21
          ruff check src/agent_dev_kit/distribution/release_support.py --select E4,E7,E9,F,B,UP,SIM,I --fix --unsafe-fixes || true
          python - <<'PY'
          from pathlib import Path
          p=Path('src/agent_dev_kit/distribution/release_support.py')
          s=p.read_text()
          old='''        with tar_path.open("rb") as raw, archive_temp.open("wb") as output:\n            with gzip.GzipFile(filename="", mode="wb", fileobj=output, mtime=0) as compressed:\n                shutil.copyfileobj(raw, compressed)'''
          new='''        with (\n            tar_path.open("rb") as raw,\n            archive_temp.open("wb") as output,\n            gzip.GzipFile(filename="", mode="wb", fileobj=output, mtime=0) as compressed,\n        ):\n            shutil.copyfileobj(raw, compressed)'''
          if old not in s:
              raise SystemExit('SIM117 target block not found')
          p.write_text(s.replace(old,new,1))
          PY
          ruff check src/agent_dev_kit/release.py src/agent_dev_kit/distribution/release_support.py
          ruff check src/agent_dev_kit/distribution/release_support.py --select E4,E7,E9,F,B,UP,SIM,I
          python -m py_compile src/agent_dev_kit/release.py src/agent_dev_kit/distribution/release_support.py
          test $(wc -c < src/agent_dev_kit/release.py) -lt 30000
          test $(wc -c < src/agent_dev_kit/distribution/release_support.py) -lt 30000
      - run: |
          rm .github/workflows/oneshot-release-support-quality.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/agent_dev_kit/distribution/release_support.py .github/workflows/oneshot-release-support-quality.yml
          git commit -m 'refactor(release): modernize support quality'
          git push origin HEAD:codex/release-support-split-20260912
