name: agent-dev-kit-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  validate-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install CI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Validate manifest and assets
        run: bash scripts/validate-assets.sh --strict

      - name: Format consistency check
        run: bash scripts/check-format.sh

      - name: Regression and smoke tests
        run: bash tests/run_all.sh
