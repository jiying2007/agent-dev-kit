name: agent-dev-kit-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-dev-kit-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract-py${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck
          python -m pip install .

      - name: Validate manifest and assets
        run: bash scripts/devkit.sh validate --strict

      - name: Validate format and shell contracts
        run: |
          bash scripts/check-format.sh
          shellcheck -S error -x -P scripts scripts/*.sh tests/*.sh

      - name: Validate contract registry and packaged schemas
        run: |
          bash tests/test_contract_registry.sh
          bash tests/test_schema_resource_sync.sh
          bash tests/test_evidence_envelope.sh
          bash tests/test_evidence_bridge.sh
          bash tests/test_release_manifest_contract.sh
          bash tests/test_promotion_evidence.sh
          bash tests/test_module_size_budget.sh

      - name: Validate direct target contracts and adapter SPI
        run: |
          python -m agent_dev_kit.cli target check --all --level static --summary-json
          bash tests/test_target_adapter_spi.sh

  regression:
    name: regression-py${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck
          python -m pip install .

      - name: Run full regression suite
        run: bash tests/run_all.sh --timing-json /tmp/adk-tests.json

      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adk-regression-timing-py${{ matrix.python-version }}
          path: /tmp/adk-tests.json
          if-no-files-found: ignore
          retention-days: 14

  deterministic-eval-package:
    name: deterministic-eval-package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package dependencies
        run: python -m pip install .

      - name: Run security policy and deterministic evaluation
        run: |
          bash scripts/devkit.sh security check
          bash scripts/devkit.sh eval run --suite deterministic

      - name: Build and validate candidate release identity
        run: |
          rm -rf /tmp/adk-release
          bash scripts/devkit.sh release build --out /tmp/adk-release
          python -m agent_dev_kit.distribution.release_contract /tmp/adk-release/agent-dev-kit-*.tar.gz

      - name: Build wheel independently of regression result
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Upload candidate wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-dev-kit-wheel
          path: dist/*.whl
          retention-days: 14

  static-security:
    name: static-security
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install static and dependency audit tools
        run: python -m pip install '.[quality]'

      - name: Run critical Python static analysis
        run: ruff check src tools tests/fixtures/fake_target_runtime.py

      - name: Run focused kernel quality analysis
        run: |
          CORE_KERNEL_PATHS=(
            src/agent_dev_kit/contracts
            src/agent_dev_kit/evidence
            src/agent_dev_kit/target_adapters
            src/agent_dev_kit/distribution
          )
          EXECUTION_POLICY_PATH=src/agent_dev_kit/execution_policy
          python -m compileall -q "${CORE_KERNEL_PATHS[@]}" "$EXECUTION_POLICY_PATH"
          ruff check "${CORE_KERNEL_PATHS[@]}" --select E4,E7,E9,F,B,UP,SIM,I
          ruff check "$EXECUTION_POLICY_PATH" --select E4,E7,E9,F,B,SIM

      - name: Run focused strict type analysis
        run: >-
          mypy
          src/agent_dev_kit/contracts
          src/agent_dev_kit/evidence
          src/agent_dev_kit/target_adapters
          src/agent_dev_kit/distribution
          src/agent_dev_kit/execution_policy

      - name: Audit declared project dependencies
        run: pip-audit --strict --progress-spinner off .

  promotion-evidence:
    name: promotion-evidence
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - contract
      - regression
      - deterministic-eval-package
      - static-security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install package
        run: python -m pip install .

      - name: Build candidate release and release contract
        run: |
          rm -rf /tmp/adk-promotion-release /tmp/adk-promotion
          mkdir -p /tmp/adk-promotion
          bash scripts/devkit.sh release build --out /tmp/adk-promotion-release
          python -m agent_dev_kit.distribution.release_contract \
            /tmp/adk-promotion-release/agent-dev-kit-*.tar.gz \
            > /tmp/adk-promotion/release-contract.json

      - name: Generate portable promotion evidence
        run: >-
          python -m agent_dev_kit.distribution.promotion_evidence generate
          --root "$GITHUB_WORKSPACE"
          --release-contract /tmp/adk-promotion/release-contract.json
          --out /tmp/adk-promotion/promotion-evidence.json
          --contract-result '${{ needs.contract.result }}'
          --regression-result '${{ needs.regression.result }}'
          --static-security-result '${{ needs.static-security.result }}'
          --deterministic-result '${{ needs.deterministic-eval-package.result }}'

      - name: Validate portable promotion evidence
        run: python -m agent_dev_kit.distribution.promotion_evidence validate /tmp/adk-promotion/promotion-evidence.json

      - name: Sign promotion evidence with keyless GitHub OIDC
        env:
          COSIGN_YES: 'true'
        run: >-
          cosign sign-blob
          --yes
          --bundle /tmp/adk-promotion/promotion-attestation.json
          /tmp/adk-promotion/promotion-evidence.json

      - name: Verify freshly signed promotion evidence
        run: >-
          cosign verify-blob
          --use-signed-timestamps
          --bundle /tmp/adk-promotion/promotion-attestation.json
          --certificate-identity https://github.com/jiying2007/agent-dev-kit/.github/workflows/ci.yml@refs/heads/main
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          /tmp/adk-promotion/promotion-evidence.json

      - name: Upload portable promotion evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adk-promotion-evidence-${{ github.sha }}
          path: |
            /tmp/adk-promotion/promotion-evidence.json
            /tmp/adk-promotion/promotion-attestation.json
            /tmp/adk-promotion/release-contract.json
          if-no-files-found: error
          retention-days: 90
