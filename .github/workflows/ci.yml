name: agent-dev-kit-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-dev-kit-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract-py${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck
          python -m pip install .

      - name: Validate manifest and assets
        run: bash scripts/devkit.sh validate --strict

      - name: Validate format and shell contracts
        run: |
          bash scripts/check-format.sh
          shellcheck -S error -x -P scripts scripts/*.sh tests/*.sh

      - name: Validate contract registry and packaged schemas
        run: |
          bash tests/test_contract_registry.sh
          bash tests/test_schema_resource_sync.sh
          bash tests/test_evidence_envelope.sh
          bash tests/test_release_manifest_contract.sh

      - name: Validate direct target contracts and adapter SPI
        run: |
          python -m agent_dev_kit.cli target check --all --level static --summary-json
          bash tests/test_target_adapter_spi.sh

  regression:
    name: regression-py${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck
          python -m pip install .

      - name: Run full regression suite
        run: bash tests/run_all.sh --timing-json /tmp/adk-tests.json

      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adk-regression-timing-py${{ matrix.python-version }}
          path: /tmp/adk-tests.json
          if-no-files-found: ignore
          retention-days: 14

  deterministic-eval-package:
    name: deterministic-eval-package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package dependencies
        run: python -m pip install .

      - name: Run security policy and deterministic evaluation
        run: |
          bash scripts/devkit.sh security check
          bash scripts/devkit.sh eval run --suite deterministic

      - name: Build and validate candidate release identity
        run: |
          rm -rf /tmp/adk-release
          bash scripts/devkit.sh release build --out /tmp/adk-release
          python -m agent_dev_kit.distribution.release_contract /tmp/adk-release/agent-dev-kit-*.tar.gz

      - name: Build wheel independently of regression result
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Upload candidate wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-dev-kit-wheel
          path: dist/*.whl
          retention-days: 14

  static-security:
    name: static-security
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install static and dependency audit tools
        run: python -m pip install '.[quality]'

      - name: Run critical Python static analysis
        run: ruff check src tools tests/fixtures/fake_target_runtime.py

      - name: Run focused kernel quality analysis
        run: |
          python -m compileall -q src/agent_dev_kit/contracts src/agent_dev_kit/evidence src/agent_dev_kit/target_adapters src/agent_dev_kit/distribution
          ruff check src/agent_dev_kit/contracts src/agent_dev_kit/evidence src/agent_dev_kit/target_adapters src/agent_dev_kit/distribution --select E4,E7,E9,F,B,UP,SIM,I

      - name: Audit declared project dependencies
        run: pip-audit --strict --progress-spinner off .
