name: agent-dev-kit-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck
          python -m pip install .

      - name: Validate manifest and assets
        run: bash scripts/devkit.sh validate --strict

      - name: Format consistency check
        run: |
          bash scripts/check-format.sh
          shellcheck -S error -x -P scripts scripts/*.sh tests/*.sh

      - name: Validate direct target contracts
        run: python -m agent_dev_kit.cli target check --all --level static --summary-json

      - name: Regression and smoke tests
        run: bash tests/run_all.sh

      - name: Security and deterministic evaluation
        run: |
          bash scripts/devkit.sh security check
          bash scripts/devkit.sh eval run --suite deterministic

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

  static-security:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install static and dependency audit tools
        run: python -m pip install '.[quality]'

      - name: Run critical Python static analysis
        run: ruff check src tools tests/fixtures/fake_target_runtime.py

      - name: Audit declared project dependencies
        run: pip-audit --strict --progress-spinner off .
