name: execution-policy-modernize-once

on:
  push:
    branches:
      - codex/execution-policy-modernization

permissions:
  contents: write

concurrency:
  group: execution-policy-modernize-once
  cancel-in-progress: false

jobs:
  modernize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/execution-policy-modernization
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned quality toolchain
        run: python -m pip install '.[quality]'

      - name: Apply only Ruff I/UP bounded fixes
        run: |
          ruff check src/agent_dev_kit/execution_policy --select I,UP --fix --unsafe-fixes
          mapfile -t changed < <(git diff --name-only)
          ((${#changed[@]} > 0)) || {
            echo '[FAIL] expected execution_policy modernization changes' >&2
            exit 1
          }
          for path in "${changed[@]}"; do
            case "$path" in
              src/agent_dev_kit/execution_policy/*.py) ;;
              *)
                echo "[FAIL] one-shot autofix escaped execution_policy: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Verify full kernel quality after fix
        run: |
          python -m compileall -q src/agent_dev_kit/execution_policy
          ruff check src/agent_dev_kit/execution_policy --select E4,E7,E9,F,B,UP,SIM,I
          mypy src/agent_dev_kit/execution_policy

      - name: Self-delete and commit bounded modernization
        run: |
          git rm .github/workflows/execution-policy-modernize-once.yml
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/execution-policy-modernize-once.yml|src/agent_dev_kit/execution_policy/*.py) ;;
              *)
                echo "[FAIL] final one-shot diff escaped bounded scope: $path" >&2
                exit 1
                ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agent_dev_kit/execution_policy .github/workflows/execution-policy-modernize-once.yml
          git commit -m 'style(execution-policy): modernize canonical kernel'
          git push origin HEAD:codex/execution-policy-modernization
