name: Codex Consumer Contract

on:
  pull_request:
    paths:
      - 'manifests/integrations/codex-runtime-binding.json'
      - '.github/contracts/codex_consumer_contract.py'
      - '.github/workflows/codex-consumer-contract.yml'
  push:
    branches: [main]
    paths:
      - 'manifests/integrations/codex-runtime-binding.json'
      - '.github/contracts/codex_consumer_contract.py'
      - '.github/workflows/codex-consumer-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate terminal Codex consumer contract
        run: python .github/contracts/codex_consumer_contract.py
      - name: Validate binding JSON
        run: python -m json.tool manifests/integrations/codex-runtime-binding.json >/dev/null
