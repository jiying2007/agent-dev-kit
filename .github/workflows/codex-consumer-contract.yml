name: Codex Consumer Contract

on:
  pull_request:
    paths:
      - 'manifests/integrations/codex-runtime-binding.json'
      - 'manifests/integrations/codex-target-bundle.json'
      - '.github/contracts/codex_consumer_contract.py'
      - '.github/workflows/codex-consumer-contract.yml'
  push:
    branches: [main]
    paths:
      - 'manifests/integrations/codex-runtime-binding.json'
      - 'manifests/integrations/codex-target-bundle.json'
      - '.github/contracts/codex_consumer_contract.py'
      - '.github/workflows/codex-consumer-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate terminal Codex consumer contract
        run: python .github/contracts/codex_consumer_contract.py
      - name: Validate binding JSON
        run: python -m json.tool manifests/integrations/codex-runtime-binding.json >/dev/null
