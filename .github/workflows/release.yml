name: agent-dev-kit-release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact immutable release tag already present in the repository
        required: true
        type: string
      release_commit:
        description: Exact commit SHA that the release tag must peel to
        required: true
        type: string
      successful_main_ci_run_id:
        description: Optional successful exact-main agent-dev-kit-ci run eligible for full-regression reuse
        required: false
        type: number
        default: 0

permissions:
  contents: read

jobs:
  package:
    if: ${{ github.event_name == 'workflow_run' && github.ref == 'refs/heads/main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Validate tag-bound release identity
        env:
          CALLED_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          CALLED_RELEASE_COMMIT: ${{ inputs.release_commit || '' }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          RELEASE_TAG=""

          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::component publishing requires a trusted main workflow_run caller"
            exit 1
          fi
          if [[ -z "$CALLED_RELEASE_TAG" || -z "$CALLED_RELEASE_COMMIT" ]]; then
            echo "::error::trusted reusable publishing requires exact tag and commit"
            exit 1
          fi
          if [[ ! "$CALLED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_tag is not a v-prefixed SemVer"
            exit 1
          fi
          if [[ ! "$CALLED_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_commit must be a full Git SHA"
            exit 1
          fi
          if [[ "$HEAD_SHA" != "$CALLED_RELEASE_COMMIT" ]]; then
            echo "::error::checked out source does not match release_commit"
            exit 1
          fi
          git fetch --force --no-tags origin "refs/tags/$CALLED_RELEASE_TAG:refs/tags/$CALLED_RELEASE_TAG"
          TAG_COMMIT="$(git rev-parse "$CALLED_RELEASE_TAG^{}")"
          if [[ "$TAG_COMMIT" != "$CALLED_RELEASE_COMMIT" ]]; then
            echo "::error::release tag does not peel to release_commit"
            exit 1
          fi
          RELEASE_TAG="$CALLED_RELEASE_TAG"
          git fetch --quiet --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$CALLED_RELEASE_COMMIT" refs/remotes/origin/main || {
            echo "::error::release commit is not in protected main history" >&2
            exit 1
          }

          SOURCE_VERSION="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          print(manifest["version"])
          PY
          )"
          EXPECTED_TAG="v${SOURCE_VERSION}"
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "::error::release tag $RELEASE_TAG does not match source version $EXPECTED_TAG"
            exit 1
          fi

      - name: Validate successful main CI reuse
        id: ci-reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_MAIN_CI_RUN_ID: ${{ inputs.successful_main_ci_run_id || '' }}
          CALLED_RELEASE_COMMIT: ${{ inputs.release_commit || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.request
          from pathlib import Path

          run_id = os.environ.get("REQUESTED_MAIN_CI_RUN_ID", "").strip()
          release_commit = os.environ.get("CALLED_RELEASE_COMMIT", "").strip()
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          verified = False

          if not release_commit or len(release_commit) != 40:
              raise SystemExit("release_commit is required for CI release authority")
          repository = os.environ["GITHUB_REPOSITORY"]
          api_root = os.environ["GITHUB_API_URL"].rstrip("/")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "agent-dev-kit-main-release-authority",
          }
          if run_id:
              if not run_id.isdigit() or int(run_id) <= 0:
                  raise SystemExit("successful_main_ci_run_id must be positive")
              url = f"{api_root}/repos/{repository}/actions/runs/{run_id}"
          else:
              # Historical orphan repair must verify ITS OWN original main push CI.
              url = (
                  f"{api_root}/repos/{repository}/actions/workflows/ci.yml/runs"
                  f"?head_sha={release_commit}&branch=main&event=push&status=success&per_page=10"
              )
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              raw = response.read(2 * 1024 * 1024 + 1)
          if len(raw) > 2 * 1024 * 1024:
              raise SystemExit("main CI provenance exceeds response budget")
          payload = json.loads(raw.decode("utf-8"))
          if run_id:
              runs = [payload]
          else:
              if not isinstance(payload, dict) or not isinstance(payload.get("workflow_runs"), list):
                  raise SystemExit("main CI lookup returned invalid workflow run collection")
              runs = payload["workflow_runs"]
          expected = {
              "name": "agent-dev-kit-ci",
              "status": "completed",
              "conclusion": "success",
              "event": "push",
              "head_branch": "main",
              "head_sha": release_commit,
              "path": ".github/workflows/ci.yml",
          }
          eligible = [
              run for run in runs
              if isinstance(run, dict)
              and all(run.get(key) == value for key, value in expected.items())
              and isinstance(run.get("id"), int) and not isinstance(run["id"], bool)
              and run["id"] > 0
              and (not run_id or run["id"] == int(run_id))
          ]
          if not eligible:
              raise SystemExit(
                  "component publishing requires successful exact-source protected-main CI; "
                  "orphan repair cannot borrow another commit's CI evidence"
              )
          # Only a caller-supplied exact CI run permits quick-smoke reuse.
          # An orphan repair without a supplied run id still runs full regression.
          verified = bool(run_id)

          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"verified_main_ci_reuse={'true' if verified else 'false'}\n")
          print(json.dumps({"verified_main_ci_reuse": verified, "run_id": run_id or None}))
          PY

      - name: Install CI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck
          python -m pip install '.[quality]'

      - name: Validate synchronized source version identity
        run: bash scripts/version-manager.sh verify

      - name: Validate and smoke
        env:
          VERIFIED_MAIN_CI_REUSE: ${{ steps.ci-reuse.outputs.verified_main_ci_reuse }}
        run: |
          bash scripts/devkit.sh validate --strict
          bash scripts/check-format.sh
          shellcheck -S error -x -P scripts scripts/*.sh tests/*.sh
          ruff check src tools tests/fixtures/fake_target_runtime.py
          pip-audit --strict --progress-spinner off .
          python -m agent_dev_kit.cli target check --all --level static --summary-json
          if [[ "$VERIFIED_MAIN_CI_REUSE" == "true" ]]; then
            echo "Reusing exact successful main full-regression evidence; running bounded release smoke."
            bash tests/run_all.sh --quick
          else
            bash tests/run_all.sh
          fi
          bash scripts/devkit.sh security check
          bash scripts/devkit.sh release check

      - name: Build reproducible release
        run: bash scripts/devkit.sh release build --out dist

      - name: Validate release manifest, SBOM and source identities
        run: python -m agent_dev_kit.distribution.release_contract dist/*.tar.gz | tee dist/release-contract.json

      - name: Validate complete release artifact bundle
        run: |
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          checksums=(dist/*.tar.gz.sha256)
          if (( ${#archives[@]} != 1 )); then
            echo "::error::expected exactly one release archive, found ${#archives[@]}"
            exit 1
          fi
          if (( ${#checksums[@]} != 1 )); then
            echo "::error::expected exactly one release checksum, found ${#checksums[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          checksum="${archive}.sha256"
          if [[ "${checksums[0]}" != "$checksum" || ! -s "$archive" || ! -s "$checksum" || ! -s dist/release-contract.json ]]; then
            echo "::error::release artifact bundle is incomplete or empty"
            exit 1
          fi
          (cd dist && sha256sum --check "$(basename "$checksum")")

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-dev-kit-dist
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/release-contract.json
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          checksums=(dist/*.tar.gz.sha256)
          if (( ${#archives[@]} != 1 || ${#checksums[@]} != 1 )); then
            echo "::error::validated release bundle is no longer singular"
            exit 1
          fi
          archive="${archives[0]}"
          checksum="${checksums[0]}"
          contract="dist/release-contract.json"
          expected_names="$(printf '%s\n' "$(basename "$archive")" "$(basename "$checksum")" "$(basename "$contract")" | sort)"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            actual_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
            if [[ "$actual_names" != "$expected_names" ]]; then
              echo "::error::existing GitHub Release assets do not match the validated bundle"
              printf 'expected:\n%s\nactual:\n%s\n' "$expected_names" "$actual_names" >&2
              exit 1
            fi
            existing_dir="$(mktemp -d)"
            trap 'rm -rf "$existing_dir"' EXIT
            gh release download "$RELEASE_TAG" --dir "$existing_dir"
            cmp "$archive" "$existing_dir/$(basename "$archive")"
            cmp "$checksum" "$existing_dir/$(basename "$checksum")"
            cmp "$contract" "$existing_dir/$(basename "$contract")"
            echo "GitHub Release already exists with byte-identical validated assets: $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" "$archive" "$checksum" "$contract" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

          release_endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          if [[ "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "$release_endpoint" --jq '.immutable')" != "true" ]]; then
            echo "::error::published GitHub Release is not immutable"
            exit 1
          fi
          remote_names="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "$release_endpoint" --jq '.assets[].name' | sort)"
          if [[ "$remote_names" != "$expected_names" ]]; then
            echo "::error::published GitHub Release asset set changed after publication"
            exit 1
          fi
          for local_asset in "$archive" "$checksum" "$contract"; do
            asset_name="$(basename "$local_asset")"
            local_digest="sha256:$(sha256sum "$local_asset" | awk '{print $1}')"
            remote_digest="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "$release_endpoint" --jq ".assets[] | select(.name == \"$asset_name\") | .digest")"
            if [[ "$remote_digest" != "$local_digest" ]]; then
              echo "::error::remote release digest mismatch for $asset_name"
              exit 1
            fi
          done
          echo "GitHub Release immutable asset digests verified: $RELEASE_TAG"
