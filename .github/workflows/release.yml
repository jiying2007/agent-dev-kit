name: agent-dev-kit-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate tag-bound release identity
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::release workflow must run from a v* tag ref"
            exit 1
          fi
          SOURCE_VERSION="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          print(manifest["version"])
          PY
          )"
          EXPECTED_TAG="v${SOURCE_VERSION}"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match source version $EXPECTED_TAG"
            exit 1
          fi

      - name: Install CI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck
          python -m pip install '.[quality]'

      - name: Validate and smoke
        run: |
          bash scripts/devkit.sh validate --strict
          bash scripts/check-format.sh
          shellcheck -S error -x -P scripts scripts/*.sh tests/*.sh
          ruff check src tools tests/fixtures/fake_target_runtime.py
          pip-audit --strict --progress-spinner off .
          python -m agent_dev_kit.cli target check --all --level static --summary-json
          bash tests/run_all.sh
          bash scripts/devkit.sh security check
          bash scripts/devkit.sh release check

      - name: Build reproducible release
        run: bash scripts/devkit.sh release build --out dist

      - name: Validate release manifest, SBOM and source identities
        run: python -m agent_dev_kit.distribution.release_contract dist/*.tar.gz | tee dist/release-contract.json

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-dev-kit-dist
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/release-contract.json
