name: github-governance-control-plane

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: github-governance-control-plane-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 33 && github.event.comment.body == '/adk-governance-verify' && github.event.comment.author_association == 'OWNER') }}
    name: github-governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate trusted main trigger
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::governance verification must run from main"
            exit 1
          fi

      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Evaluate native GitHub ruleset governance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/control_plane/github_governance.py
          --repo "$GITHUB_REPOSITORY"
          --branch main
          --scope hosted-ruleset
          --out "$RUNNER_TEMP/github-governance-report.json"

      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adk-github-governance-${{ github.sha }}
          path: ${{ runner.temp }}/github-governance-report.json
          if-no-files-found: error
          retention-days: 90
