name: branch-gc

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete only exact merged-PR branch heads after revalidation'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: branch-gc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: branch-gc-dry-run
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.apply)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Validate Branch GC implementation
        run: python -m py_compile tools/control_plane/branch_gc.py

      - name: Evaluate merged branch cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/control_plane/branch_gc.py \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --mode dry-run \
            --report "$RUNNER_TEMP/branch-gc-report.json"
          cat "$RUNNER_TEMP/branch-gc-report.json"

      - name: Upload Branch GC report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adk-branch-gc-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/branch-gc-report.json
          if-no-files-found: error
          retention-days: 30

  apply:
    name: branch-gc-apply
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Validate Branch GC implementation
        run: python -m py_compile tools/control_plane/branch_gc.py

      - name: Apply exact merged branch cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/control_plane/branch_gc.py \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --mode apply \
            --report "$RUNNER_TEMP/branch-gc-report.json"
          cat "$RUNNER_TEMP/branch-gc-report.json"

      - name: Upload Branch GC report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adk-branch-gc-${{ github.sha }}
          path: ${{ runner.temp }}/branch-gc-report.json
          if-no-files-found: error
          retention-days: 30
