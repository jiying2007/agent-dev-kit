name: oneshot-evaluation-split
on:
  push:
    branches: [codex/evaluation-support-split-20260912]
permissions:
  contents: write
jobs:
  split:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          python -m pip install '.[quality]'
      - name: Mechanically extract deterministic evaluation support
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          source_path = Path('src/agent_dev_kit/evaluation.py')
          support_path = Path('src/agent_dev_kit/evaluation_support.py')
          budget_path = Path('manifests/module_size_budget.json')
          source = source_path.read_text(encoding='utf-8')
          lines = source.splitlines(keepends=True)
          targets = [
              '_prompt_digest',
              '_deterministic_safety',
              '_load_effect_inputs',
              '_latency_summary',
              'load_tasks',
              'run_deterministic',
              '_extract_json_text',
              'runtime_version',
              '_codex_usage',
              '_claude_usage',
              '_collect_reported_models',
              '_codex_reported_models',
          ]
          tree = ast.parse(source)
          nodes = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in targets
          }
          missing = [name for name in targets if name not in nodes]
          if missing:
              raise SystemExit(f'missing functions: {missing}')

          blocks = []
          spans = []
          for name in targets:
              node = nodes[name]
              blocks.append(''.join(lines[node.lineno - 1:node.end_lineno]).rstrip() + '\n')
              spans.append((node.lineno - 1, node.end_lineno))

          keep = [True] * len(lines)
          for start, end in spans:
              for index in range(start, end):
                  keep[index] = False
          updated = ''.join(line for index, line in enumerate(lines) if keep[index])

          anchor = 'from .model import Manifest, ManifestError, ensure_within, sha256_file\n'
          imports = '''from .evaluation_support import (\n    _claude_usage,\n    _codex_reported_models,\n    _codex_usage,\n    _collect_reported_models,\n    _deterministic_safety,\n    _extract_json_text,\n    _latency_summary,\n    _load_effect_inputs,\n    _prompt_digest,\n    load_tasks as load_tasks,\n    run_deterministic as run_deterministic,\n    runtime_version as runtime_version,\n)\n'''
          if anchor not in updated:
              raise SystemExit('evaluation import anchor missing')
          updated = updated.replace(anchor, anchor + imports, 1)
          while '\n\n\n\n' in updated:
              updated = updated.replace('\n\n\n\n', '\n\n\n')
          source_path.write_text(updated, encoding='utf-8')

          header = '''"""Deterministic evaluation parsing and measurement helpers."""\n\nfrom __future__ import annotations\n\nimport hashlib\nimport json\nimport math\nimport shutil\nimport statistics\nimport subprocess\nimport time\nfrom pathlib import Path\nfrom typing import Any, Dict, List, Mapping, Optional, Sequence\n\nfrom .matcher import match_text\nfrom .model import Manifest, ManifestError\n\n\n'''
          support_path.write_text(header + '\n\n'.join(block.rstrip() for block in blocks) + '\n', encoding='utf-8')

          budget = json.loads(budget_path.read_text(encoding='utf-8'))
          removed = budget['exceptions'].pop('src/agent_dev_kit/evaluation.py', None)
          if removed is None:
              raise SystemExit('evaluation exception missing')
          if len(budget['exceptions']) != 3:
              raise SystemExit(f"unexpected exception count: {len(budget['exceptions'])}")
          budget_path.write_text(json.dumps(budget, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          ruff check src/agent_dev_kit/evaluation.py src/agent_dev_kit/evaluation_support.py --fix
          ruff check src/agent_dev_kit/evaluation.py src/agent_dev_kit/evaluation_support.py
          python -m py_compile src/agent_dev_kit/evaluation.py src/agent_dev_kit/evaluation_support.py
          test $(wc -c < src/agent_dev_kit/evaluation.py) -lt 30000
          test $(wc -c < src/agent_dev_kit/evaluation_support.py) -lt 30000
          python - <<'PY'
          import json
          from pathlib import Path
          budget=json.loads(Path('manifests/module_size_budget.json').read_text())
          assert len(budget['exceptions']) == 3, budget
          assert 'src/agent_dev_kit/evaluation.py' not in budget['exceptions'], budget
          PY
          bash tests/test_effect_eval.sh
          bash tests/test_module_size_budget.sh
      - name: Commit generated refactor and remove one-shot workflow
        run: |
          rm .github/workflows/oneshot-evaluation-split.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/agent_dev_kit/evaluation.py src/agent_dev_kit/evaluation_support.py manifests/module_size_budget.json .github/workflows/oneshot-evaluation-split.yml
          git commit -m 'refactor(evaluation): extract deterministic support'
          git push origin HEAD:codex/evaluation-support-split-20260912
