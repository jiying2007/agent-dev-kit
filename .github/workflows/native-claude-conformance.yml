name: claude-native-conformance-campaign

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_REAL_NATIVE to acknowledge a real authenticated Claude Code campaign
        required: true
        type: string
      claude_code_version:
        description: Exact @anthropic-ai/claude-code package version
        required: true
        type: string
      model:
        description: Exact Claude model identifier for the retained campaign
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: claude-native-conformance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  campaign:
    name: claude-native-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
      CLAUDE_MODEL: ${{ inputs.model }}
    steps:
      - name: Validate trusted main and explicit real-campaign confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::real native campaign must run from main"
            exit 1
          fi
          if [[ "$CONFIRMATION" != "RUN_REAL_NATIVE" ]]; then
            echo "::error::confirmation must be RUN_REAL_NATIVE"
            exit 1
          fi
          if [[ ! "$CLAUDE_CODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::claude_code_version must be an exact package version"
            exit 1
          fi
          if [[ -z "$CLAUDE_MODEL" || ! "$CLAUDE_MODEL" =~ ^[A-Za-z0-9._:@/-]+$ ]]; then
            echo "::error::model must be an explicit bounded identifier"
            exit 1
          fi

      - name: Checkout exact trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install exact ADK and Claude Code runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install .
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          RUNTIME_BIN="$(command -v claude)"
          test -n "$RUNTIME_BIN"
          PACKAGE_ROOT="$(npm root --global)/@anthropic-ai/claude-code"
          PACKAGE_VERSION="$(node -p "require('${PACKAGE_ROOT}/package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$CLAUDE_CODE_VERSION" ]]; then
            echo "::error::installed Claude Code package version drift"
            exit 1
          fi
          RUNTIME_VERSION="$("$RUNTIME_BIN" --version | head -n1 | tr -d '\r')"
          test -n "$RUNTIME_VERSION"
          {
            echo "runtime_bin=$RUNTIME_BIN"
            echo "runtime_version=$RUNTIME_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Provision noninteractive user-level API-key helper
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "::error::ANTHROPIC_API_KEY repository secret is not configured"
            exit 1
          fi
          echo "::add-mask::$ANTHROPIC_API_KEY"
          KEY_FILE="$RUNNER_TEMP/anthropic-api-key"
          HELPER="$RUNNER_TEMP/anthropic-api-key-helper"
          printf '%s' "$ANTHROPIC_API_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          cat > "$HELPER" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          cat '$KEY_FILE'
          EOF
          chmod 700 "$HELPER"
          mkdir -p "$HOME/.claude"
          python - "$HOME/.claude/settings.json" "$HELPER" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          path.write_text(
              json.dumps({"apiKeyHelper": sys.argv[2]}, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          chmod 600 "$HOME/.claude/settings.json"

      - name: Authenticate Claude Code noninteractively
        shell: bash
        env:
          RUNTIME_BIN: ${{ steps.runtime.outputs.runtime_bin }}
        run: |
          set -euo pipefail
          AUTH_OUT="$("$RUNTIME_BIN" -p             "Reply with exactly ADK_CLAUDE_AUTH_OK and nothing else."             --model "$CLAUDE_MODEL"             --max-turns 1             --output-format text)"
          if [[ "$AUTH_OUT" != "ADK_CLAUDE_AUTH_OK" ]]; then
            echo "::error::Claude Code authentication preflight did not return the expected bounded result"
            exit 1
          fi

      - name: Build private semantic campaign inputs
        id: inputs
        shell: bash
        env:
          RUNTIME_BIN: ${{ steps.runtime.outputs.runtime_bin }}
        run: |
          set -euo pipefail
          COMMANDS="$RUNNER_TEMP/native-commands.json"
          ASSERTIONS="$RUNNER_TEMP/native-assertions.json"
          python - "$COMMANDS" "$ASSERTIONS" "$RUNTIME_BIN" "$CLAUDE_MODEL" <<'PY'
          import json
          import sys
          from pathlib import Path

          commands_path, assertions_path, runtime_bin, model = sys.argv[1:5]
          common = ["--model", model, "--max-turns", "1", "--output-format", "text"]
          commands = {
              "version": [runtime_bin, "--version"],
              "discovery": [
                  runtime_bin,
                  "-p",
                  "/adk-verification-before-completion The only task for this invocation is to repeat the description value from this loaded project's skill frontmatter. Output that description exactly and nothing else.",
                  *common,
              ],
              "load": [
                  runtime_bin,
                  "-p",
                  "/adk-verification-before-completion Do not execute the workflow. Read the loaded project skill body and output only its first Markdown heading exactly, including the leading hash, and nothing else.",
                  *common,
              ],
              "trigger": [
                  runtime_bin,
                  "-p",
                  "A code change is about to be reported complete, but no verification command has run. Use the most relevant project skill. From that skill's Quality Gate section, output exactly the single sentence that forbids speculative completion wording, and nothing else.",
                  *common,
              ],
          }
          assertions = {
              "discovery": {
                  "stream": "stdout",
                  "contains": "完成前验证门禁，确保交付声明与证据一致",
                  "case_sensitive": True,
              },
              "load": {
                  "stream": "stdout",
                  "contains": "# adk-verification-before-completion",
                  "case_sensitive": True,
              },
              "trigger": {
                  "stream": "stdout",
                  "contains": "禁止使用“应该可以/理论上通过”等无证据措辞。",
                  "case_sensitive": True,
              },
          }
          Path(commands_path).write_text(
              json.dumps(commands, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          Path(assertions_path).write_text(
              json.dumps(assertions, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          chmod 600 "$COMMANDS" "$ASSERTIONS"
          {
            echo "commands=$COMMANDS"
            echo "assertions=$ASSERTIONS"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare semantic-v2 native campaign
        shell: bash
        env:
          RUNTIME_BIN: ${{ steps.runtime.outputs.runtime_bin }}
          RUNTIME_VERSION: ${{ steps.runtime.outputs.runtime_version }}
          COMMANDS: ${{ steps.inputs.outputs.commands }}
          ASSERTIONS: ${{ steps.inputs.outputs.assertions }}
        run: |
          set -euo pipefail
          mkdir -p reports/runtime "$RUNNER_TEMP/g21-native"
          bash scripts/devkit.sh native-campaign prepare             --target claude-code             --profile core             --runtime-binary "$RUNTIME_BIN"             --runtime-version "$RUNTIME_VERSION"             --authority-id github-oidc-native-conformance             --execution-authority human-approved             --verification-backend ci-provenance-verifier             --auth-mode home             --timeout-seconds 180             --commands-json "$COMMANDS"             --assertions-json "$ASSERTIONS"             --receipt-path reports/runtime/claude-native-g21.json             --plan-out "$RUNNER_TEMP/g21-native/plan.json"             --candidate-contract-out "$RUNNER_TEMP/g21-native/candidate-contract.json"             --summary-json             > "$RUNNER_TEMP/g21-native/prepare-summary.json"

      - name: Run semantic-v2 native campaign
        shell: bash
        env:
          RUNTIME_BIN: ${{ steps.runtime.outputs.runtime_bin }}
          COMMANDS: ${{ steps.inputs.outputs.commands }}
          ASSERTIONS: ${{ steps.inputs.outputs.assertions }}
        run: |
          set -euo pipefail
          bash scripts/devkit.sh native-campaign run             --plan "$RUNNER_TEMP/g21-native/plan.json"             --candidate-contract "$RUNNER_TEMP/g21-native/candidate-contract.json"             --commands-json "$COMMANDS"             --assertions-json "$ASSERTIONS"             --runtime-binary "$RUNTIME_BIN"             --evidence-out "$RUNNER_TEMP/g21-native/evidence.json"             --summary-json             > "$RUNNER_TEMP/g21-native/run-summary.json"

      - name: Finalize unsigned native receipt candidate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/devkit.sh native-campaign finalize             --plan "$RUNNER_TEMP/g21-native/plan.json"             --candidate-contract "$RUNNER_TEMP/g21-native/candidate-contract.json"             --evidence "$RUNNER_TEMP/g21-native/evidence.json"             --receipt-out reports/runtime/claude-native-g21.json             --final-contract-out "$RUNNER_TEMP/g21-native/final-contract.json"             --summary-json             > "$RUNNER_TEMP/g21-native/finalize-summary.json"

      - name: Sign exact canonical native receipt with GitHub OIDC
        shell: bash
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from agent_dev_kit.model import canonical_json_bytes
          receipt = json.loads(Path("reports/runtime/claude-native-g21.json").read_text(encoding="utf-8"))
          Path("/tmp/g21-native-receipt-canonical.json").write_bytes(canonical_json_bytes(receipt))
          PY
          cosign sign-blob             --yes             --bundle "$RUNNER_TEMP/g21-native/receipt.sigstore.json"             /tmp/g21-native-receipt-canonical.json
          cosign verify-blob             --use-signed-timestamps             --bundle "$RUNNER_TEMP/g21-native/receipt.sigstore.json"             --certificate-identity "https://github.com/jiying2007/agent-dev-kit/.github/workflows/native-claude-conformance.yml@refs/heads/main"             --certificate-oidc-issuer "https://token.actions.githubusercontent.com"             /tmp/g21-native-receipt-canonical.json

      - name: Build managed trust registry candidate and verify production loader
        shell: bash
        run: |
          set -euo pipefail
          COSIGN_BIN="$(command -v cosign)"
          python - "$COSIGN_BIN" <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          from agent_dev_kit.model import canonical_json_bytes

          root = Path.cwd()
          temp = Path(os.environ["RUNNER_TEMP"]) / "g21-native"
          receipt_path = root / "reports/runtime/claude-native-g21.json"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          bundle = temp / "receipt.sigstore.json"
          cosign = Path(sys.argv[1]).resolve()

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          registry = {
              "schema": "adk-native-conformance-trust-registry/v1",
              "status": "active",
              "authority_model": "owner-reviewed-managed-registry",
              "authorities": {
                  "github-oidc-native-conformance": {
                      "enabled": True,
                      "policy_backend": "ci-provenance-verifier",
                      "verifier": "sigstore-cosign-blob",
                      "allowed_targets": ["claude-code"],
                      "certificate_identity": "https://github.com/jiying2007/agent-dev-kit/.github/workflows/native-claude-conformance.yml@refs/heads/main",
                      "certificate_oidc_issuer": "https://token.actions.githubusercontent.com",
                      "cosign_binary": "cosign",
                      "cosign_binary_sha256": sha(cosign),
                      "receipts": {
                          receipt["receipt_id"]: {
                              "receipt_canonical_sha256": hashlib.sha256(
                                  canonical_json_bytes(receipt)
                              ).hexdigest(),
                              "bundle_path": "reports/runtime/claude-native-g21.sigstore.json",
                              "bundle_sha256": sha(bundle),
                          }
                      },
                  }
              },
          }
          (temp / "registry-candidate.json").write_text(
              json.dumps(registry, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )

          verify_root = Path(os.environ["RUNNER_TEMP"]) / "g21-loader-root"
          if verify_root.exists():
              shutil.rmtree(verify_root)
          subprocess.run(
              ["git", "archive", "HEAD"],
              check=True,
              stdout=(temp / "source.tar").open("wb"),
          )
          verify_root.mkdir(parents=True)
          subprocess.run(
              ["tar", "-xf", str(temp / "source.tar"), "-C", str(verify_root)],
              check=True,
          )
          (verify_root / "reports/runtime").mkdir(parents=True, exist_ok=True)
          shutil.copy2(receipt_path, verify_root / "reports/runtime/claude-native-g21.json")
          shutil.copy2(bundle, verify_root / "reports/runtime/claude-native-g21.sigstore.json")
          shutil.copy2(temp / "registry-candidate.json", verify_root / "manifests/native_conformance_trust_registry.json")
          shutil.copy2(temp / "final-contract.json", verify_root / "manifests/target-contracts/claude-code.json")

          env = dict(os.environ)
          env["PYTHONPATH"] = str(verify_root / "src")
          check = subprocess.run(
              [
                  sys.executable,
                  "-c",
                  (
                      "import json,sys;"
                      "from pathlib import Path;"
                      "from agent_dev_kit.model import Manifest;"
                      "from agent_dev_kit.target_contracts import load_target_contract;"
                      "root=Path(sys.argv[1]);"
                      "manifest=Manifest.load(root);"
                      "contract=load_target_contract(manifest,'claude-code');"
                      "print(json.dumps({'status':'pass','target':contract.name,'digest':contract.digest},separators=(',',':')))"
                  ),
                  str(verify_root),
              ],
              cwd=verify_root,
              env=env,
              text=True,
              capture_output=True,
              check=False,
              timeout=60,
          )
          if check.returncode != 0:
              raise SystemExit(check.stderr or check.stdout or "production loader verification failed")
          (temp / "production-loader.json").write_text(check.stdout, encoding="utf-8")
          PY

      - name: Package retained candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          cp reports/runtime/claude-native-g21.json "$RUNNER_TEMP/g21-native/receipt.json"
          cp /tmp/g21-native-receipt-canonical.json "$RUNNER_TEMP/g21-native/receipt.canonical.json"
          rm -f "$RUNNER_TEMP/g21-native/source.tar"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "g21-native"
          records = {}
          for path in sorted(root.iterdir()):
              if path.is_file():
                  records[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / "artifact-index.json").write_text(
              json.dumps(
                  {
                      "schema": "adk-native-hosted-campaign-artifact-index/v1",
                      "status": "candidate-owner-review-required",
                      "source_sha": os.environ["GITHUB_SHA"],
                      "files": records,
                      "contains_raw_commands": False,
                      "contains_raw_assertion_text": False,
                      "contains_provider_secret": False,
                      "target_promotion_performed": False,
                      "registry_promotion_performed": False,
                      "release_authorized": False,
                  },
                  sort_keys=True,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload candidate native conformance package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g21-claude-native-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/g21-native
          if-no-files-found: error
          retention-days: 90
