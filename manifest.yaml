version: 2.9.0
locale: zh-CN
platforms:
  - linux-embedded
  - mcu-baremetal
  - mcu-rtos

tool_targets:
  claude-code:
    display_name: Claude Code
    default_root: ~/.claude
    agents_dir: agents
    skills_dir: skills
    detect:
      - ~/.claude
  hermes-agent:
    display_name: Hermes Agent
    default_root: ~/.hermes
    agents_dir: agents
    skills_dir: skills
    detect:
      - ~/.hermes
  opencode:
    display_name: OpenCode
    default_root: ~/.config/opencode
    agents_dir: agents
    skills_dir: skills
    detect:
      - ~/.config/opencode

quality_tiers:
  p0:
    description: 核心主干资产，必须具备可执行流程与验收证据模板
  p1:
    description: 稳定扩展资产，必须具备命令、样例和质量门禁
  p2:
    description: 可选场景资产，必须具备边界说明和最小验证路径

knowledge_layers:
  L0:
    name: toolchain
    description: 工具链配置知识（外部 agent runtime 与工具配置参考）
    location: knowledge/L0-toolchain/
  L1:
    name: general-tech
    description: 通用技术知识（语言、框架、算法、设计模式）
    location: knowledge/L1-general-tech/
  L2:
    name: domain
    description: 业务领域知识（芯片/板级、启动链、BSP、驱动、RTOS、协议栈、量产现场）
    location: knowledge/L2-domain/
  L3:
    name: project
    description: 项目上下文（架构决策、设计模式、历史决策）
    location: knowledge/L3-project/
  L4:
    name: session
    description: 会话上下文（临时状态，不持久化）
    location: knowledge/L4-session/

context_layers:
  L1-always-loaded:
    description: 会话常驻层（始终加载）
    max_tokens: 4000
    files:
        - AGENTS.md
        - docs/best-practices.md
        - docs/workflows.md
  L2-phase-triggered:
    description: 阶段触发层（按阶段加载）
    triggers:
      route:
        - skills/adk-runtime-router/
      propose:
        - skills/adk-runtime-router/
        - skills/adk-requirements-triage/
        - skills/adk-adr-writer/
      apply:
        - skills/adk-code-simplification/
        - skills/adk-unit-test-embedded/
      verify:
        - skills/adk-verification-before-completion/
      review:
        - skills/adk-chinese-code-review/
  L3-on-demand:
    description: 按需查询层（按需加载）
    sources:
      - knowledge/L2-domain/datasheets/
      - knowledge/L2-domain/oops-patterns/
      - knowledge/L2-domain/bsp-history/
      - knowledge/L2-domain/errata/

embedded_context_layers:
  L1-always-loaded:
    description: 嵌入式会话常驻层
    max_tokens: 4000
    files:
      - AGENTS.md
      - docs/embedded-constraints.md
      - docs/hardware-interaction-rules.md
  L2-phase-triggered:
    description: 嵌入式阶段触发层
    triggers:
      bsp-analysis:
        - skills/adk-bsp-porting-playbook/
        - knowledge/L2-domain/datasheets/
      driver-development:
        - skills/adk-driver-bringup-checklist/
        - skills/adk-interrupt-dma-patterns/
      debugging:
        - skills/adk-systematic-debugging/
        - knowledge/L2-domain/oops-patterns/
  L3-on-demand:
    description: 嵌入式按需查询层
    sources:
      - knowledge/L2-domain/datasheets/
      - knowledge/L2-domain/errata/
      - knowledge/L2-domain/bsp-history/

knowledge_types:
  rules:
    description: 必须遵守的约束和规范
    location: rules/
  patterns:
    description: 可复用的解决方案和设计模式
    location: skills/
  cases:
    description: 具体的实现示例和代码片段
    location: templates/
  experiences:
    description: 踩坑记录和最佳实践
    location: docs/explorations/
  indexes:
    description: 知识的元数据和导航
    location: docs/reference/

knowledge_maturity:
  draft:
    description: 初始记录，未经验证
  verified:
    description: 经过实践验证
  mature:
    description: 被广泛引用，稳定可靠

agents:
  - name: requirements-analyst
    path: agents/requirements-analyst/AGENTS.md
    quality_tier: p0
    description: 需求澄清、验收标准和范围边界分析
  - name: architecture-planner
    path: agents/architecture-planner/AGENTS.md
    quality_tier: p0
    description: 架构方案、模块边界和技术决策规划
  - name: driver-engineer
    path: agents/driver-engineer/AGENTS.md
    quality_tier: p0
    description: 驱动实现、bring-up 和底层联调
  - name: component-engineer
    path: agents/component-engineer/AGENTS.md
    quality_tier: p0
    description: 组件接口、模块实现和集成边界治理
  - name: application-engineer
    path: agents/application-engineer/AGENTS.md
    quality_tier: p0
    description: 设备侧应用、上位机工具和业务逻辑实现
  - name: build-release-engineer
    path: agents/build-release-engineer/AGENTS.md
    quality_tier: p0
    description: 构建、打包、版本发布和回滚链路
  - name: test-validation-engineer
    path: agents/test-validation-engineer/AGENTS.md
    quality_tier: p0
    description: 测试策略、验证证据和完成前门禁
  - name: performance-reliability-engineer
    path: agents/performance-reliability-engineer/AGENTS.md
    quality_tier: p0
    description: 性能剖析、稳定性和可靠性风险治理
  - name: security-compliance-reviewer
    path: agents/security-compliance-reviewer/AGENTS.md
    quality_tier: p0
    description: 安全、合规、凭据和供应链风险审查
  - name: code-review-governor
    path: agents/code-review-governor/AGENTS.md
    quality_tier: p0
    description: 代码审查、反馈闭环和质量放行治理
  # 嵌入式专用 Agent 角色
  - name: adk-bsp-analyst
    path: agents/adk-bsp-analyst/AGENTS.md
    quality_tier: p1
    description: BSP 代码分析、架构梳理、历史追溯
  - name: adk-driver-developer
    path: agents/adk-driver-developer/AGENTS.md
    quality_tier: p1
    description: 嵌入式驱动开发
  - name: adk-hardware-debugger
    path: agents/adk-hardware-debugger/AGENTS.md
    quality_tier: p1
    description: 硬件问题调试、oops 分析
  # Agent 角色分离
  - name: adk-planner
    path: agents/adk-planner/AGENTS.md
    quality_tier: p1
    description: 需求分析、任务拆解、方案设计
  - name: adk-generator
    path: agents/adk-generator/AGENTS.md
    quality_tier: p1
    description: 编码实现、单元测试编写
  - name: adk-evaluator
    path: agents/adk-evaluator/AGENTS.md
    quality_tier: p1
    description: 代码评审、质量验证

