optional_skills:
  - name: adk-artifact-gated-lite
    path: optional-skills/adk-artifact-gated-lite/SKILL.md
    quality_tier: p2
    description: 高风险变更时使用轻量 artifact 标签与门禁模板固定交付证据
    triggers:
      - "高风险变更"
      - "产物门禁"
      - "追溯证据"
  - name: adk-cross-team-handoff
    path: optional-skills/adk-cross-team-handoff/SKILL.md
    quality_tier: p2
    description: 跨团队交接时统一目标、边界和验收责任
    triggers:
      - "团队交接"
      - "模块移交"
      - "跨团队"
  - name: adk-data-fetch
    path: optional-skills/adk-data-fetch/SKILL.md
    quality_tier: p2
    description: 数据获取技能组合——包含邮件获取与网页正文提取
    triggers:
      - "获取数据"
      - "数据抓取"
      - "fetch data"
