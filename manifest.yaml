  - intent: "Design RTOS tasks"
    intent_zh: "RTOS任务设计/实时任务调度"
    primary_skill: rtos-task-design
    supporting_skills: []
  - intent: "Handle interrupts or DMA"
    intent_zh: "中断处理/DMA处理/中断DMA"
    primary_skill: interrupt-dma-patterns
    supporting_skills: []
  - intent: "Integrate protocol stack"
    intent_zh: "协议栈集成/协议集成"
    primary_skill: protocol-stack-integration
    supporting_skills: [interface-contract-design]
  - intent: "Component API stability"
    intent_zh: "API稳定性/组件API兼容/接口稳定性"
    primary_skill: component-api-stability
    supporting_skills: [interface-contract-design]
  - intent: "Cross-compile with CMake"
    intent_zh: "CMake交叉编译"
    primary_skill: cmake-cross-build
    supporting_skills: []
  - intent: "Debug with OpenOCD/GDB"
    intent_zh: "OpenOCD/GDB调试"
    primary_skill: toolchain-debug-openocd-gdb
    supporting_skills: [systematic-debugging]
  - intent: "Integration test HIL/SIL"
    intent_zh: "HIL/SIL集成测试"
    primary_skill: integration-hil-sil
    supporting_skills: [unit-test-embedded]
  - intent: "Fault injection testing"
    intent_zh: "故障注入测试"
    primary_skill: fault-injection-recovery
    supporting_skills: [integration-hil-sil]
  - intent: "Performance profiling"
    intent_zh: "性能分析/性能优化/性能调优"
    primary_skill: performance-profiling-embedded
    supporting_skills: [systematic-debugging]
  - intent: "Version release"
    intent_zh: "版本发布/准备发布/要上线了"
    primary_skill: release-versioning
    supporting_skills: [commit-pr-quality-gate]
  - intent: "Code review in Chinese"
    intent_zh: "中文代码审查/代码评审/review 代码"
    primary_skill: chinese-code-review
    supporting_skills: []
  - intent: "Chinese commit conventions"
    intent_zh: "中文提交/commit 规范/提交信息格式"
    primary_skill: chinese-commit-conventions
    supporting_skills: []
  - intent: "Simplify code"
    intent_zh: "代码简化/简化代码/重构简化"
    primary_skill: code-simplification
    supporting_skills: []
  - intent: "Context engineering"
    intent_zh: "上下文工程/context 工程/提示词工程"
    primary_skill: context-engineering
    supporting_skills: []
  - intent: "Diagnose issues"
    intent_zh: "诊断循环/诊断问题/故障诊断"
