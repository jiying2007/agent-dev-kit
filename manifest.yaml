  - intent: "Submit code or PR"
    intent_zh: "提交代码/发起PR"
    primary_skill: adk-commit-pr-quality-gate
    supporting_skills: [adk-verification-before-completion]
  - intent: "Write ADR"
    intent_zh: "写ADR/架构决策记录"
    primary_skill: adk-adr-writer
    supporting_skills: []
  - intent: "Design register map"
    intent_zh: "设计寄存器映射"
    primary_skill: adk-register-map-design
    supporting_skills: [adk-interface-contract-design]
  - intent: "Bring up driver"
    intent_zh: "驱动开发/驱动调试/写驱动/驱动bringup"
    primary_skill: adk-driver-bringup-checklist
    supporting_skills: [adk-register-map-design]
  - intent: "Port BSP"
    intent_zh: "BSP移植"
    primary_skill: adk-bsp-porting-playbook
    supporting_skills: [adk-driver-bringup-checklist]
  - intent: "Design RTOS tasks"
    intent_zh: "RTOS任务设计/实时任务调度"
    primary_skill: adk-rtos-task-design
    supporting_skills: []
