    supporting_skills: []
  - intent: "Integrate protocol stack"
    intent_zh: "协议栈集成/协议集成"
    primary_skill: adk-protocol-stack-integration
    supporting_skills: [adk-interface-contract-design]
  - intent: "Component API stability"
    intent_zh: "API稳定性/组件API兼容/接口稳定性"
    primary_skill: adk-component-api-stability
    supporting_skills: [adk-interface-contract-design]
  - intent: "Cross-compile with CMake"
    intent_zh: "CMake交叉编译"
    primary_skill: adk-cmake-cross-build
    supporting_skills: []
  - intent: "Debug with OpenOCD/GDB"
    intent_zh: "OpenOCD/GDB调试"
