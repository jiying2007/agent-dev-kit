default_profile: core
profiles:
  core:
    description: 通用 ADK 核心配置（需求、架构、实现、验证与评审）
    trigger_examples:
      - "开始新功能开发"
      - "需要写代码"
      - "帮我实现这个需求"
    include_agents:
      - requirements-analyst
      - architecture-planner
      - driver-engineer
      - component-engineer
      - test-validation-engineer
      - code-review-governor
    include_skills:
      - adk-runtime-router
      - adk-requirements-triage
      - adk-lightweight-planning
      - adk-task-breakdown
      - adk-test-strategy
      - adk-code-review-loop
      - adk-parallel-agent-governance
      - adk-worktree-governance
      - adk-branch-closeout
      - adk-adr-writer
      - adk-interface-contract-design
      - adk-component-api-stability
      - adk-driver-implementation
      - adk-driver-bringup-checklist
      - adk-static-analysis-c-cpp
      - adk-systematic-debugging
      - adk-unit-test-embedded
      - adk-verification-before-completion
      - adk-after-action-review
      - adk-token-context-governance
      - adk-context-compress-handoff
      - adk-repo-drift-remediation
      - adk-commit-pr-quality-gate
  release-hardening:
    description: 发布加固配置（安全审查、性能优化、合规检查）
    trigger_examples:
