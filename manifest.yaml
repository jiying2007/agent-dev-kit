version: 2.9.0
locale: zh-CN
platforms:
  - linux-embedded
  - mcu-baremetal
  - mcu-rtos

tool_targets:
  claude-code:
    display_name: Claude Code
    default_root: ~/.claude
    agents_dir: agents
    skills_dir: skills
    detect:
      - ~/.claude
  hermes-agent:
    display_name: Hermes Agent
    default_root: ~/.hermes
    agents_dir: agents
    skills_dir: skills
    detect:
      - ~/.hermes
  opencode:
    display_name: OpenCode
    default_root: ~/.config/opencode
    agents_dir: agents
    skills_dir: skills
    detect:
      - ~/.config/opencode

quality_tiers:
  p0:
    description: 核心主干资产，必须具备可执行流程与验收证据模板
  p1:
    description: 稳定扩展资产，必须具备命令、样例和质量门禁
  p2:
    description: 可选场景资产，必须具备边界说明和最小验证路径

knowledge_layers:
  L0:
    name: toolchain
    description: 工具链配置知识（外部 agent runtime 与工具配置参考）
    location: knowledge/L0-toolchain/
  L1:
    name: general-tech
    description: 通用技术知识（语言、框架、算法、设计模式）
    location: knowledge/L1-general-tech/
  L2:
    name: domain
    description: 业务领域知识（芯片/板级、启动链、BSP、驱动、RTOS、协议栈、量产现场）
    location: knowledge/L2-domain/
  L3:
    name: project
    description: 项目上下文（架构决策、设计模式、历史决策）
    location: knowledge/L3-project/
  L4:
    name: session
    description: 会话上下文（临时状态，不持久化）
    location: knowledge/L4-session/

context_layers:
  L1-always-loaded:
    description: 会话常驻层（始终加载）
    max_tokens: 4000
    files:
        - AGENTS.md
        - docs/best-practices.md
        - docs/workflows.md
  L2-phase-triggered:
    description: 阶段触发层（按阶段加载）
    triggers:
      route:
        - skills/adk-runtime-router/
      propose:
        - skills/adk-runtime-router/
        - skills/adk-requirements-triage/
        - skills/adk-adr-writer/
      apply:
        - skills/adk-code-simplification/
        - skills/adk-unit-test-embedded/
      verify:
        - skills/adk-verification-before-completion/
      review:
        - skills/adk-chinese-code-review/
  L3-on-demand:
    description: 按需查询层（按需加载）
    sources:
      - knowledge/L2-domain/datasheets/
      - knowledge/L2-domain/oops-patterns/
      - knowledge/L2-domain/bsp-history/
      - knowledge/L2-domain/errata/

embedded_context_layers:
  L1-always-loaded:
    description: 嵌入式会话常驻层
    max_tokens: 4000
    files:
      - AGENTS.md
      - docs/embedded-constraints.md
      - docs/hardware-interaction-rules.md
  L2-phase-triggered:
    description: 嵌入式阶段触发层
    triggers:
      bsp-analysis:
        - skills/adk-bsp-porting-playbook/
        - knowledge/L2-domain/datasheets/
      driver-development:
        - skills/adk-driver-bringup-checklist/
        - skills/adk-interrupt-dma-patterns/
      debugging:
        - skills/adk-systematic-debugging/
        - knowledge/L2-domain/oops-patterns/
  L3-on-demand:
    description: 嵌入式按需查询层
    sources:
      - knowledge/L2-domain/datasheets/
      - knowledge/L2-domain/errata/
      - knowledge/L2-domain/bsp-history/

knowledge_types:
  rules:
    description: 必须遵守的约束和规范
    location: rules/
  patterns:
    description: 可复用的解决方案和设计模式
    location: skills/
  cases:
    description: 具体的实现示例和代码片段
    location: templates/
  experiences:
    description: 踩坑记录和最佳实践
    location: docs/explorations/
  indexes:
    description: 知识的元数据和导航
    location: docs/reference/

knowledge_maturity:
  draft:
    description: 初始记录，未经验证
  verified:
    description: 经过实践验证
  mature:
    description: 被广泛引用，稳定可靠

agents:
  - name: requirements-analyst
    path: agents/requirements-analyst/AGENTS.md
    quality_tier: p0
    description: 需求澄清、验收标准和范围边界分析
    owns:
      - 需求边界
      - 验收标准
    does_not_own:
      - 代码实现
      - 发布操作
    handoff_to:
      - architecture-planner
      - test-validation-engineer
      - code-review-governor
    default_skills:
      - adk-requirements-triage
      - adk-task-breakdown
    quality_gate: 目标、非目标、影响面、验收标准和风险必须可验证
  - name: architecture-planner
    path: agents/architecture-planner/AGENTS.md
    quality_tier: p0
    description: 架构方案、模块边界和技术决策规划
    owns:
      - 架构边界
      - 接口决策
    does_not_own:
      - 直接编码
      - 发布签核
    handoff_to:
      - component-engineer
      - driver-engineer
      - code-review-governor
    default_skills:
      - adk-interface-contract-design
      - adk-adr-writer
    quality_gate: 设计必须包含接口、兼容性、迁移和回退边界
  - name: driver-engineer
    path: agents/driver-engineer/AGENTS.md
    quality_tier: p0
    description: 驱动实现、bring-up 和底层联调
    owns:
      - 驱动实现
      - bring-up 证据
    does_not_own:
      - 产品需求裁剪
      - 发布放行
    handoff_to:
      - test-validation-engineer
      - code-review-governor
    default_skills:
      - adk-driver-implementation
      - adk-driver-bringup-checklist
      - adk-systematic-debugging
    quality_gate: 驱动变更必须绑定硬件约束、验证证据和回归路径
  - name: component-engineer
    path: agents/component-engineer/AGENTS.md
    quality_tier: p0
    description: 组件接口、模块实现和集成边界治理
    owns:
      - 组件接口
      - 模块实现
    does_not_own:
      - 需求验收口径
      - 发布版本策略
    handoff_to:
      - test-validation-engineer
      - code-review-governor
    default_skills:
      - adk-interface-contract-design
      - adk-component-api-stability
    quality_gate: 组件变更必须保留 API 稳定性和集成验证证据
  - name: application-engineer
    path: agents/application-engineer/AGENTS.md
    quality_tier: p0
    description: 设备侧应用、上位机工具和业务逻辑实现
    owns:
      - 应用逻辑
      - 工具行为
    does_not_own:
      - 架构最终裁决
      - 发布放行
    handoff_to:
      - test-validation-engineer
      - code-review-governor
    default_skills:
      - adk-systematic-debugging
      - adk-unit-test-embedded
    quality_gate: 应用行为变更必须包含用户路径、错误路径和回归证据
  - name: build-release-engineer
    path: agents/build-release-engineer/AGENTS.md
    quality_tier: p0
    description: 构建、打包、版本发布和回滚链路
    owns:
      - 构建打包
      - 发布回滚
    does_not_own:
      - 需求变更
      - 安全风险豁免
    handoff_to:
      - security-compliance-reviewer
      - performance-reliability-engineer
    default_skills:
      - adk-release-versioning
      - adk-commit-pr-quality-gate
    quality_gate: 发布必须绑定版本、制品、校验、回滚和放行证据
  - name: test-validation-engineer
    path: agents/test-validation-engineer/AGENTS.md
    quality_tier: p0
    description: 测试策略、验证证据和完成前门禁
    owns:
      - 测试策略
      - 验证证据
    does_not_own:
      - 功能实现
      - 风险豁免
    handoff_to:
      - code-review-governor
      - build-release-engineer
    default_skills:
      - adk-test-strategy
      - adk-verification-before-completion
    quality_gate: 完成结论必须与验证命令、退出码和证据路径一致
  - name: performance-reliability-engineer
    path: agents/performance-reliability-engineer/AGENTS.md
    quality_tier: p0
    description: 性能剖析、稳定性和可靠性风险治理
    owns:
      - 性能分析
      - 可靠性风险
    does_not_own:
      - 功能需求裁决
      - 安全签核
    handoff_to:
      - build-release-engineer
      - code-review-governor
    default_skills:
      - adk-performance-profiling-embedded
      - adk-fault-injection-recovery
    quality_gate: 性能和可靠性结论必须包含基线、负载条件和对比证据
  - name: security-compliance-reviewer
    path: agents/security-compliance-reviewer/AGENTS.md
    quality_tier: p0
    description: 安全、合规、凭据和供应链风险审查
    owns:
      - 安全审查
      - 供应链风险
    does_not_own:
      - 功能实现
      - 发布执行
    handoff_to:
      - build-release-engineer
      - code-review-governor
    default_skills:
      - adk-static-analysis-c-cpp
      - adk-commit-pr-quality-gate
    quality_gate: 高风险项必须修复、降级或显式记录风险接受
  - name: code-review-governor
    path: agents/code-review-governor/AGENTS.md
    quality_tier: p0
    description: 代码审查、反馈闭环和质量放行治理
    owns:
      - 审查分级
      - 放行判断
    does_not_own:
      - 直接修复代码
      - 发布执行
    handoff_to:
      - requirements-analyst
      - test-validation-engineer
    default_skills:
      - adk-code-review-loop
      - adk-commit-pr-quality-gate
    quality_gate: blocker 必须修复或明确风险接受后才能放行
  # 嵌入式专用 Agent 角色
  - name: bsp-analyst
    path: agents/bsp-analyst/AGENTS.md
    quality_tier: p1
    description: BSP 代码分析、架构梳理、历史追溯
    owns:
      - BSP 分析
      - 历史追溯
    does_not_own:
      - 驱动实现
      - 发布放行
    handoff_to:
      - driver-engineer
      - architecture-planner
    default_skills:
      - adk-bsp-analysis
      - adk-bsp-porting-playbook
    quality_gate: BSP 结论必须包含入口、依赖、风险和追溯证据
  - name: hardware-debugger
    path: agents/hardware-debugger/AGENTS.md
    quality_tier: p1
    description: 硬件故障定位、oops 分析和板级调试证据整理
    owns:
      - 硬件故障定位
      - oops 分析
    does_not_own:
      - 长期架构设计
      - 发布放行
    handoff_to:
      - driver-engineer
      - test-validation-engineer
    default_skills:
      - adk-hardware-debugging
      - adk-systematic-debugging
    quality_gate: 硬件调试结论必须包含现象、假设、实验和证据

