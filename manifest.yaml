install:
  default_mode: symlink
  backup_before_install: true
  lock_version: false

routing:
  enabled: true
  fallback_profile: core


dependencies:
  required:
    - bash
    - awk
    - sed
    - grep
  optional:
    - yq
    - jq
    - rg
