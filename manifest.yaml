    supporting_skills: []
  - intent: "Review with documentation"
    intent_zh: "文档审查/review with docs/查文档验证"
    primary_skill: grill-with-docs
    supporting_skills: []

install:
  # default_mode 改为 copy，避免 symlink 在工作区变动时影响运行目录稳定性
  default_mode: copy
  default_tool: auto
  default_target: ""
  command: ./scripts/install_assets.sh --tool auto --mode copy --profile embedded-fullstack

dependencies:
  required:
    - bash>=4
  optional:
    - rsync
    - shellcheck
