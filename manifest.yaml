version: 2.7.0
locale: zh-CN
platforms:
  - linux-embedded
  - mcu-baremetal
  - mcu-rtos

tool_targets:
  codex:
    display_name: Codex
    default_root: ~/.codex
    agents_dir: agents
    skills_dir: skills
    detect:
      - $CODEX_HOME
      - ~/.codex
  claude-code:
    display_name: Claude Code
    default_root: ~/.claude
    agents_dir: agents
    skills_dir: skills
    detect:
      - ~/.claude
  hermes-agent:
    display_name: Hermes Agent
    default_root: ~/.hermes
    agents_dir: agents
    skills_dir: skills
    detect:
      - ~/.hermes
  opencode:
    display_name: OpenCode
    default_root: ~/.config/opencode
    agents_dir: agents
    skills_dir: skills
    detect:
      - ~/.config/opencode

quality_tiers:
  p0:
    description: 核心主干资产，必须具备可执行流程与验收证据模板
  p1:
    description: 稳定扩展资产，必须具备命令、样例和质量门禁
  p2:
    description: 可选场景资产，必须具备边界说明和最小验证路径

agents:
  - name: requirements-analyst
    path: agents/requirements-analyst/AGENTS.md
