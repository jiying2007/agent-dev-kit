default_profile: core
profiles:
  core:
    description: 通用 ADK 核心配置（需求、架构、实现、验证与评审）
    trigger_examples:
      - "开始新功能开发"
      - "需要写代码"
      - "帮我实现这个需求"
    include_agents:
      - requirements-analyst
      - architecture-planner
      - driver-engineer
      - component-engineer
      - test-validation-engineer
      - code-review-governor
    include_skills:
      - adk-runtime-router
      - adk-requirements-triage
      - adk-task-breakdown
      - adk-test-strategy
      - adk-code-review-loop
      - adk-parallel-agent-governance
      - adk-worktree-governance
      - adk-branch-closeout
      - adk-interface-contract-design
      - adk-static-analysis-c-cpp
      - adk-systematic-debugging
      - adk-unit-test-embedded
      - adk-verification-before-completion
      - adk-after-action-review
      - adk-token-context-governance
      - adk-commit-pr-quality-gate
  release-hardening:
    description: 发布加固配置（安全审查、性能优化、合规检查）
    trigger_examples:
      - "准备发布"
      - "发布前检查"
      - "安全审查"
    include_agents:
      - security-compliance-reviewer
      - performance-reliability-engineer
      - build-release-engineer
    include_skills:
      - adk-release-versioning
      - adk-grill-with-docs
      - adk-test-strategy
      - adk-code-review-loop
      - adk-branch-closeout
      - adk-requirements-triage
      - adk-task-breakdown
      - adk-interface-contract-design
      - adk-static-analysis-c-cpp
      - adk-systematic-debugging
      - adk-unit-test-embedded
      - adk-verification-before-completion
      - adk-after-action-review
      - adk-token-context-governance
      - adk-commit-pr-quality-gate
  personal-core:
    description: 个人通用 ADK 资产配置（核心功能 + 发布检查）
    trigger_examples:
      - "个人项目开发"
      - "快速原型验证"
    extends: core
    include_agents:
      - requirements-analyst
      - architecture-planner
      - driver-engineer
      - code-review-governor
    include_skills:
      - adk-requirements-triage
      - adk-task-breakdown
      - adk-commit-pr-quality-gate
      - adk-release-versioning
  embedded-fullstack:
    description: 嵌入式全栈开发配置（芯片/板级、启动链、BSP、驱动、组件、应用、工具、验证、量产和现场维护）
    trigger_examples:
      - "嵌入式全栈开发"
      - "BSP 驱动开发"
      - "RTOS 应用开发"
      - "量产产测和现场维护"
    extends: core
    include_agents:
      - requirements-analyst
      - architecture-planner
      - driver-engineer
      - component-engineer
      - application-engineer
      - test-validation-engineer
      - code-review-governor
    include_skills:
      - adk-requirements-triage
      - adk-task-breakdown
      - adk-interface-contract-design
      - adk-register-map-design
      - adk-driver-bringup-checklist
      - adk-bsp-porting-playbook
      - adk-rtos-task-design
      - adk-interrupt-dma-patterns
      - adk-protocol-stack-integration
      - adk-component-api-stability
      - adk-cmake-cross-build
      - adk-toolchain-debug-openocd-gdb
      - adk-static-analysis-c-cpp
      - adk-systematic-debugging
      - adk-unit-test-embedded
      - adk-integration-hil-sil
      - adk-fault-injection-recovery
      - adk-performance-profiling-embedded
      - adk-release-versioning
      - adk-production-field-readiness
      - adk-verification-before-completion
      - adk-after-action-review
      - adk-token-context-governance
      - adk-commit-pr-quality-gate
  team-core:
    description: 团队协作配置（交接/验证/评审）
    trigger_examples:
      - "团队协作开发"
      - "代码交接"
      - "团队评审"
    extends: core
    include_agents:
      - requirements-analyst
      - architecture-planner
      - code-review-governor
    include_skills:
      - adk-requirements-triage
      - adk-task-breakdown
      - adk-commit-pr-quality-gate
      - adk-after-action-review
      - adk-token-context-governance
      - adk-grill-with-docs
      - adk-chinese-commit-conventions
      - adk-chinese-code-review
  openspec-driven:
    description: Spec 驱动开发配置（需求/设计/任务链路）
    trigger_examples:
      - "Spec 驱动开发"
      - "需求分析与设计"
      - "任务拆解"
    extends: core
    include_agents:
      - requirements-analyst
      - architecture-planner
    include_skills:
      - adk-requirements-triage
      - adk-task-breakdown
      - adk-interface-contract-design
      - adk-adr-writer
  large-refactor:
    description: 大型重构配置（API 稳定性 + 代码简化）
    trigger_examples:
      - "大型代码重构"
      - "API 重构"
      - "架构调整"
    extends: embedded-fullstack
    include_agents:
      - architecture-planner
      - code-review-governor
    include_skills:
      - adk-component-api-stability
      - adk-code-simplification
      - adk-static-analysis-c-cpp
  incident-response:
    description: 线上事故响应配置（根因/复盘/恢复）
    trigger_examples:
      - "线上事故处理"
      - "故障排查"
      - "事故复盘"
    include_agents:
      - performance-reliability-engineer
      - security-compliance-reviewer
    include_skills:
      - adk-systematic-debugging
      - adk-fault-injection-recovery
  research-intake:
    description: 参考仓吸收配置（候选筛选与审查）
    trigger_examples:
      - "吸收参考仓"
      - "研究新技术"
      - "评估外部方案"
    include_agents:
      - requirements-analyst
    include_skills:
      - adk-repo-prompt-analyzer
      - adk-skill-deep-analyzer
      - adk-intake-workflow

workflows:
  - name: adk-delivery-gate
    description: agent-dev-kit 通用资产生产交付门禁
    triggers:
      - "优化 adk"
      - "agent-dev-kit 交付"
      - "嵌入式资产发布"
      - "完成前验证"
    skills:
      - adk-runtime-router
      - adk-requirements-triage
      - adk-task-breakdown
      - adk-test-strategy
      - adk-code-review-loop
      - adk-verification-before-completion
      - adk-after-action-review
      - adk-token-context-governance
      - adk-commit-pr-quality-gate
    agents:
      - requirements-analyst
      - architecture-planner
      - test-validation-engineer
      - code-review-governor
    commands:
      - "rtk bash scripts/check-skills.sh"
    verification:
      - "rtk bash scripts/check.sh"

mcp_servers: []

change_sets:
  - name: adk-change-governance
    description: agent-dev-kit 变更工件、阶段门禁与证据索引规范
    root: docs/changes
    archive_root: docs/changes/archive
    commands:
      - "rtk bash scripts/devkit.sh propose"
      - "rtk bash scripts/devkit.sh apply"
      - "rtk bash scripts/devkit.sh verify"
