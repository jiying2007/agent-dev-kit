      - "flaky test"
      - "测试不稳定"

routing:
  - intent: "Requirements are unclear"
    intent_zh: "需求不清楚/需要澄清/需求模糊/需求不明确"
    primary_skill: adk-requirements-triage
    supporting_skills: []
  - intent: "Break down a large task"
    intent_zh: "拆解大任务/分解需求/任务太大/任务拆分"
    primary_skill: adk-task-breakdown
    supporting_skills: [adk-requirements-triage]
  - intent: "Design API or interface"
    intent_zh: "设计接口/API设计/接口设计"
    primary_skill: adk-interface-contract-design
    supporting_skills: [adk-requirements-triage]
  - intent: "Write unit tests"
    intent_zh: "写单元测试"
    primary_skill: adk-unit-test-embedded
    supporting_skills: []
  - intent: "Run static analysis"
    intent_zh: "静态分析/代码检查"
    primary_skill: adk-static-analysis-c-cpp
    supporting_skills: []
  - intent: "Debug an issue"
