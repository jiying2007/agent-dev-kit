      - "读取邮箱"
      - "imap fetch"
  - name: adk-fetch-url-content
    path: optional-skills/adk-data-fetch/adk-fetch-url-content/SKILL.md
    quality_tier: p2
    description: URL 正文提取——从网页提取结构化内容
    triggers:
      - "获取网页内容"
      - "抓取链接正文"
      - "fetch url"
  - name: adk-incident-rca-report
    path: optional-skills/adk-incident-rca-report/SKILL.md
    quality_tier: p2
    description: 线上事故复盘与根因分析闭环
    triggers:
      - "线上事故"
      - "故障复盘"
      - "RCA分析"
      - "根因分析"
  - name: adk-planning-execution-loop
