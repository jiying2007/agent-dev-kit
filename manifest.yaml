optional_skills:
  - name: artifact-gated-lite
    path: optional-skills/artifact-gated-lite/SKILL.md
    quality_tier: p2
    description: 高风险变更时使用轻量 artifact 标签与门禁模板固定交付证据
    triggers:
      - "高风险变更"
      - "产物门禁"
      - "追溯证据"
  - name: cross-team-handoff
    path: optional-skills/cross-team-handoff/SKILL.md
    quality_tier: p2
    description: 跨团队交接时统一目标、边界和验收责任
    triggers:
      - "团队交接"
      - "模块移交"
      - "跨团队"
  - name: data-fetch
    path: optional-skills/data-fetch/SKILL.md
    quality_tier: p2
    description: 数据获取技能组合——包含邮件获取与网页正文提取
    triggers:
      - "获取数据"
      - "数据抓取"
      - "fetch data"
    sub_skills:
      - email-imap-fetch
      - fetch-url-content
  - name: email-imap-fetch
    path: optional-skills/data-fetch/email-imap-fetch/SKILL.md
    quality_tier: p2
    description: IMAP 邮件获取——从邮箱获取邮件列表和内容
    triggers:
      - "获取邮件"
      - "读取邮箱"
      - "imap fetch"
  - name: fetch-url-content
    path: optional-skills/data-fetch/fetch-url-content/SKILL.md
    quality_tier: p2
    description: URL 正文提取——从网页提取结构化内容
    triggers:
      - "获取网页内容"
      - "抓取链接正文"
      - "fetch url"
  - name: incident-rca-report
    path: optional-skills/incident-rca-report/SKILL.md
    quality_tier: p2
    description: 线上事故复盘与根因分析闭环
    triggers:
      - "线上事故"
      - "故障复盘"
      - "RCA分析"
      - "根因分析"
  - name: planning-execution-loop
    path: optional-skills/planning-execution-loop/SKILL.md
    quality_tier: p2
    description: 长任务计划审查、分阶段执行、恢复与收口闭环
    triggers:
      - "执行计划"
      - "多阶段任务"
      - "计划审查"
  - name: security-supply-chain
    path: optional-skills/security-supply-chain/SKILL.md
    quality_tier: p2
    description: 第三方技能、脚本与参考资产引入前的安全和供应链审查
    triggers:
      - "供应链审查"
      - "第三方引入"
      - "安全审查"
  - name: skill-composition-governance
    path: optional-skills/skill-composition-governance/SKILL.md
    quality_tier: p2
    description: 治理技能组合、触发优先级、fallback 与弃用关系
    triggers:
      - "技能组合"
      - "触发冲突"
      - "技能治理"
  - name: test-flakiness-triage
    path: optional-skills/test-flakiness-triage/SKILL.md
    quality_tier: p2
    description: 定位测试波动根因并给出稳定化方案
    triggers:
      - "测试波动"
      - "flaky test"
      - "测试不稳定"

routing:
  - intent: "Requirements are unclear"
    intent_zh: "需求不清楚/需要澄清/需求模糊/需求不明确"
    primary_skill: requirements-triage
    supporting_skills: []
  - intent: "Break down a large task"
    intent_zh: "拆解大任务/分解需求/任务太大/任务拆分"
    primary_skill: task-breakdown
    supporting_skills: [requirements-triage]
  - intent: "Design API or interface"
    intent_zh: "设计接口/API设计/接口设计"
    primary_skill: interface-contract-design
    supporting_skills: [requirements-triage]
  - intent: "Write unit tests"
    intent_zh: "写单元测试"
    primary_skill: unit-test-embedded
    supporting_skills: []
  - intent: "Run static analysis"
    intent_zh: "静态分析/代码检查"
    primary_skill: static-analysis-c-cpp
    supporting_skills: []
  - intent: "Debug an issue"
    intent_zh: "调试/排查问题"
    primary_skill: systematic-debugging
    supporting_skills: []
  - intent: "Ready to complete"
    intent_zh: "准备完成/要提交了/准备提交"
    primary_skill: verification-before-completion
    supporting_skills: [commit-pr-quality-gate]
  - intent: "Submit code or PR"
    intent_zh: "提交代码/发起PR"
    primary_skill: commit-pr-quality-gate
    supporting_skills: [verification-before-completion]
  - intent: "Write ADR"
    intent_zh: "写ADR/架构决策记录"
    primary_skill: adr-writer
    supporting_skills: []
  - intent: "Design register map"
    intent_zh: "设计寄存器映射"
    primary_skill: register-map-design
    supporting_skills: [interface-contract-design]
  - intent: "Bring up driver"
    intent_zh: "驱动开发/驱动调试/写驱动/驱动bringup"
    primary_skill: driver-bringup-checklist
    supporting_skills: [register-map-design]
  - intent: "Port BSP"
    intent_zh: "BSP移植"
