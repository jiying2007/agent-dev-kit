    intent_zh: "中文提交/commit 规范/提交信息格式/提交格式/commit message 格式"
    primary_skill: adk-chinese-commit-conventions
    supporting_skills: []
  - intent: "Simplify code"
    intent_zh: "代码简化/简化代码/重构简化"
    primary_skill: adk-code-simplification
    supporting_skills: []
  - intent: "Context engineering"
    intent_zh: "上下文工程/context 工程/提示词工程/构建上下文/context 构建"
    primary_skill: adk-context-engineering
    supporting_skills: []
  - intent: "Diagnose issues"
    intent_zh: "诊断循环/诊断问题/故障诊断/问题定位"
    primary_skill: adk-diagnose-loop
    supporting_skills: []
  - intent: "Review with documentation"
    intent_zh: "文档审查/review with docs/查文档验证/文档验证/验证文档"
    primary_skill: adk-grill-with-docs
    supporting_skills: []

install:
  # default_mode 改为 copy，避免 symlink 在工作区变动时影响运行目录稳定性
  default_mode: copy
  default_tool: auto
  default_target: ""
  command: ./scripts/install_assets.sh --tool auto --mode copy --profile embedded-fullstack

dependencies:
  required:
    - bash>=4
  optional:
    - rsync
    - shellcheck
