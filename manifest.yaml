default_profile: core
profiles:
  core:
    description: 嵌入式系统开发核心配置（需求、架构、实现、验证与评审）
    trigger_examples:
      - "开始新功能开发"
      - "需要写代码"
      - "帮我实现这个需求"
    include_agents:
      - requirements-analyst
      - architecture-planner
      - driver-engineer
      - component-engineer
      - test-validation-engineer
      - code-review-governor
    include_skills:
      - adk-requirements-triage
      - adk-task-breakdown
      - adk-interface-contract-design
      - adk-static-analysis-c-cpp
      - adk-systematic-debugging
      - adk-unit-test-embedded
      - adk-verification-before-completion
      - adk-commit-pr-quality-gate
  release-hardening:
    description: 发布加固配置（安全审查、性能优化、合规检查）
    trigger_examples:
      - "准备发布"
      - "发布前检查"
      - "安全审查"
    include_agents:
      - security-compliance-reviewer
      - performance-reliability-engineer
      - build-release-engineer
    include_skills:
      - adk-release-versioning
      - adk-grill-with-docs
      - adk-requirements-triage
      - adk-task-breakdown
      - adk-interface-contract-design
      - adk-static-analysis-c-cpp
      - adk-systematic-debugging
      - adk-unit-test-embedded
      - adk-verification-before-completion
      - adk-commit-pr-quality-gate
  personal-core:
    description: 个人 ~/codex 声明式交付配置（核心功能 + 发布检查）
    trigger_examples:
      - "个人项目开发"
      - "快速原型验证"
    extends: core
    include_agents:
      - requirements-analyst
      - architecture-planner
      - driver-engineer
      - code-review-governor
    include_skills:
      - adk-requirements-triage
      - adk-task-breakdown
      - adk-commit-pr-quality-gate
      - adk-release-versioning
  embedded-fullstack:
    description: 嵌入式全栈开发配置（驱动/组件/应用全覆盖）
    trigger_examples:
      - "嵌入式全栈开发"
      - "BSP 驱动开发"
      - "RTOS 应用开发"
    extends: core
    include_agents:
      - requirements-analyst
      - architecture-planner
      - driver-engineer
      - component-engineer
      - application-engineer
      - test-validation-engineer
      - code-review-governor
    include_skills:
      - adk-requirements-triage
      - adk-task-breakdown
      - adk-interface-contract-design
      - adk-register-map-design
      - adk-driver-bringup-checklist
      - adk-bsp-porting-playbook
      - adk-rtos-task-design
      - adk-interrupt-dma-patterns
      - adk-protocol-stack-integration
      - adk-component-api-stability
      - adk-cmake-cross-build
      - adk-static-analysis-c-cpp
      - adk-systematic-debugging
      - adk-unit-test-embedded
      - adk-verification-before-completion
      - adk-commit-pr-quality-gate
  team-core:
    description: 团队协作配置（交接/验证/评审）
    trigger_examples:
      - "团队协作开发"
      - "代码交接"
      - "团队评审"
    extends: core
    include_agents:
      - requirements-analyst
      - architecture-planner
      - code-review-governor
    include_skills:
      - adk-requirements-triage
      - adk-task-breakdown
      - adk-commit-pr-quality-gate
      - adk-grill-with-docs
      - adk-chinese-commit-conventions
      - adk-chinese-code-review
  openspec-driven:
    description: Spec 驱动开发配置（需求/设计/任务链路）
    trigger_examples:
      - "Spec 驱动开发"
      - "需求分析与设计"
      - "任务拆解"
    extends: core
    include_agents:
      - requirements-analyst
      - architecture-planner
    include_skills:
      - adk-requirements-triage
      - adk-task-breakdown
      - adk-interface-contract-design
      - adk-adr-writer
  large-refactor:
    description: 大型重构配置（API 稳定性 + 代码简化）
    trigger_examples:
      - "大型代码重构"
      - "API 重构"
      - "架构调整"
    extends: embedded-fullstack
    include_agents:
      - architecture-planner
      - code-review-governor
    include_skills:
      - adk-component-api-stability
      - adk-code-simplification
      - adk-static-analysis-c-cpp
  incident-response:
    description: 线上事故响应配置（根因/复盘/恢复）
    trigger_examples:
      - "线上事故处理"
      - "故障排查"
      - "事故复盘"
    include_agents:
      - performance-reliability-engineer
      - security-compliance-reviewer
    include_skills:
      - adk-systematic-debugging
      - adk-fault-injection-recovery
  research-intake:
    description: 参考仓吸收配置（候选筛选与审查）
    trigger_examples:
      - "吸收参考仓"
      - "研究新技术"
      - "评估外部方案"
    include_agents:
      - requirements-analyst
    include_skills:
      - adk-repo-prompt-analyzer
      - adk-skill-deep-analyzer
      - adk-intake-workflow

workflows:
  - name: adk-delivery-gate
    description: agent-dev-kit 到 ~/codex 的生产交付门禁
    triggers:
      - "优化 adk"
      - "agent-dev-kit 交付"
      - "嵌入式资产发布"
      - "完成前验证"
    skills:
      - adk-requirements-triage
      - adk-task-breakdown
      - adk-verification-before-completion
      - adk-commit-pr-quality-gate
    agents:
      - requirements-analyst
      - architecture-planner
      - test-validation-engineer
      - code-review-governor
    commands:
      - "rtk bash scripts/check-skills.sh"
    verification:
      - "rtk bash scripts/check.sh"

mcp_servers: []

change_sets:
  - name: adk-change-governance
    description: agent-dev-kit 变更工件、阶段门禁与证据索引规范
    root: docs/changes
    archive_root: docs/changes/archive
    commands:
      - "rtk bash scripts/devkit.sh propose"
      - "rtk bash scripts/devkit.sh apply"
      - "rtk bash scripts/devkit.sh verify"
      - "rtk bash scripts/devkit.sh review"
      - "rtk bash scripts/devkit.sh archive"
    required_files:
      - proposal.md
      - design.md
      - tasks.md
      - checklist.md
      - negative-results.md
      - verify-report.md
      - review-report.md

optional_skills:
  - name: adk-incident-rca-report
    path: optional-skills/adk-incident-rca-report/SKILL.md
    quality_tier: p2
  - name: adk-cross-team-handoff
    path: optional-skills/adk-cross-team-handoff/SKILL.md
    quality_tier: p2
  - name: adk-data-fetch
    path: optional-skills/adk-data-fetch/SKILL.md
    quality_tier: p2
  - name: adk-email-imap-fetch
    path: optional-skills/adk-data-fetch/adk-email-imap-fetch/SKILL.md
    quality_tier: p2
  - name: adk-fetch-url-content
    path: optional-skills/adk-data-fetch/adk-fetch-url-content/SKILL.md
    quality_tier: p2
  - name: adk-planning-execution-loop
    path: optional-skills/adk-planning-execution-loop/SKILL.md
    quality_tier: p2
  - name: adk-security-supply-chain
    path: optional-skills/adk-security-supply-chain/SKILL.md
    quality_tier: p2
  - name: adk-skill-composition-governance
    path: optional-skills/adk-skill-composition-governance/SKILL.md
    quality_tier: p2
  - name: adk-test-flakiness-triage
    path: optional-skills/adk-test-flakiness-triage/SKILL.md
    quality_tier: p2

install:
  default_mode: symlink
  backup_before_install: true
  lock_version: false

routing:
  enabled: true
  fallback_profile: core
  intents:
    - intent: requirements_triage
      intent_zh: "需求不清楚/需要澄清/需求模糊/需求不明确"
      primary_skill: adk-requirements-triage
      supporting_skills: []
    - intent: task_breakdown
      intent_zh: "任务太大/拆解任务/拆解大任务/任务拆分"
      primary_skill: adk-task-breakdown
      supporting_skills:
        - adk-requirements-triage
    - intent: interface_contract_design
      intent_zh: "设计接口/接口契约/API设计"
      primary_skill: adk-interface-contract-design
      supporting_skills:
        - adk-requirements-triage
    - intent: unit_test_embedded
      intent_zh: "写单元测试/补单测/嵌入式单测"
      primary_skill: adk-unit-test-embedded
      supporting_skills: []
    - intent: static_analysis_c_cpp
      intent_zh: "静态分析/C静态检查/Cpp静态检查"
      primary_skill: adk-static-analysis-c-cpp
      supporting_skills: []
    - intent: systematic_debugging
      intent_zh: "调试/调试问题/排查根因"
      primary_skill: adk-systematic-debugging
      supporting_skills: []
    - intent: verification_before_completion
      intent_zh: "准备完成/完成前验证/交付前验证"
      primary_skill: adk-verification-before-completion
      supporting_skills: []
    - intent: commit_pr_quality_gate
      intent_zh: "提交代码/准备提交/提交前检查"
      primary_skill: adk-commit-pr-quality-gate
      supporting_skills:
        - adk-verification-before-completion
    - intent: adr_writer
