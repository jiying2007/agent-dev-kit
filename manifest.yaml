version: 2.4.0
locale: zh-CN
platforms:
  - linux-embedded
  - mcu-baremetal
  - mcu-rtos

tool_targets:
  codex:
    display_name: Codex
    default_root: ~/.codex
    agents_dir: agents
    skills_dir: skills
    detect:
      - $CODEX_HOME
      - ~/.codex
  claude-code:
    display_name: Claude Code
    default_root: ~/.claude
    agents_dir: agents
    skills_dir: skills
    detect:
      - ~/.claude
  hermes-agent:
    display_name: Hermes Agent
    default_root: ~/.hermes
    agents_dir: agents
    skills_dir: skills
    detect:
      - ~/.hermes
  opencode:
    display_name: OpenCode
    default_root: ~/.config/opencode
    agents_dir: agents
    skills_dir: skills
    detect:
      - ~/.config/opencode

quality_tiers:
  p0:
    description: 核心主干资产，必须具备可执行流程与验收证据模板
  p1:
    description: 稳定扩展资产，必须具备命令、样例和质量门禁
  p2:
    description: 可选场景资产，必须具备边界说明和最小验证路径

profiles:
  core:
    description: 通用研发核心配置（跨模块需求、实现、验证与评审）
    trigger_examples: ["开始新功能开发", "需要写代码", "帮我实现这个需求"]
    include_agents:
      - requirements-analyst
      - architecture-planner
      - application-engineer
      - test-validation-engineer
      - code-review-governor
    include_skills:
      - requirements-triage
      - task-breakdown
      - interface-contract-design
      - unit-test-embedded
      - static-analysis-c-cpp
      - systematic-debugging
      - verification-before-completion
      - commit-pr-quality-gate
  personal-core:
    description: 个人 ~/.codex 生产默认配置（精简核心 + 完成前门禁）
    trigger_examples: ["个人项目开发", "我在写自己的代码"]
    extends:
      - core
    include_agents:
      - build-release-engineer
    include_skills:
      - adr-writer
      - release-versioning
  embedded-fullstack:
    description: C/C++ 嵌入式全栈默认配置（驱动、组件、应用）
    trigger_examples: ["嵌入式开发", "写驱动代码", "移植BSP"]
    extends:
      - core
    include_agents:
      - driver-engineer
      - component-engineer
      - build-release-engineer
      - performance-reliability-engineer
      - security-compliance-reviewer
    include_skills:
      - adr-writer
      - register-map-design
      - driver-bringup-checklist
      - bsp-porting-playbook
      - rtos-task-design
      - interrupt-dma-patterns
      - protocol-stack-integration
      - component-api-stability
      - cmake-cross-build
      - toolchain-debug-openocd-gdb
      - integration-hil-sil
      - fault-injection-recovery
      - performance-profiling-embedded
      - release-versioning
  release-hardening:
    description: 发布前强化配置（安全、可靠性、发布治理）
    trigger_examples: ["准备发布", "发布前检查", "要上线了"]
    optional: true
    conflicts_with: [incident-response, large-refactor]
    include_agents:
      - build-release-engineer
      - performance-reliability-engineer
      - security-compliance-reviewer
    include_skills:
      - integration-hil-sil
      - static-analysis-c-cpp
      - fault-injection-recovery
      - performance-profiling-embedded
      - release-versioning
  artifact-gated-lite:
    description: 高风险变更的轻量产物门禁配置（强调可追溯交付证据）
    optional: true
    trigger_examples: ["高风险变更", "需要追溯证据", "门禁交付"]
    extends:
      - core
  team-core:
    description: 团队交付配置（责任矩阵、交接、验证与评审）
    trigger_examples: ["团队协作", "多人开发", "代码交接"]
    optional: true
    extends:
      - core
    include_agents:
      - build-release-engineer
      - security-compliance-reviewer
    include_skills:
      - adr-writer
      - release-versioning
  openspec-driven:
    description: Spec 驱动变更配置（requirements/design/tasks 与 gdk workflow 对齐）
    trigger_examples: ["用 Spec 驱动开发", "先写规格再编码"]
    optional: true
    extends:
      - core
    include_skills:
      - adr-writer
  large-refactor:
    description: 大型重构配置（边界冻结、API 稳定性、基线对比与回归）
    trigger_examples: ["大型重构", "重构老代码", "架构升级"]
    optional: true
    conflicts_with: [release-hardening]
    extends:
      - core
    include_agents:
      - build-release-engineer
    include_skills:
      - component-api-stability
      - release-versioning
  incident-response:
    description: 事故响应配置（根因定位、复盘、恢复与验证）
    trigger_examples: ["线上事故", "紧急修复", "生产问题"]
    optional: true
    conflicts_with: [release-hardening]
    extends:
      - core
    include_agents:
      - performance-reliability-engineer
      - security-compliance-reviewer
    include_skills:
      - fault-injection-recovery
      - release-versioning
  research-intake:
    description: 参考仓吸收配置（候选筛选、组合治理与供应链审查）
    trigger_examples: ["吸收参考仓", "评估新工具", "引入新技术"]
    optional: true
    include_agents:
      - requirements-analyst
      - architecture-planner
      - code-review-governor
    include_skills:
      - requirements-triage
      - task-breakdown
      - commit-pr-quality-gate

default_profile: embedded-fullstack

